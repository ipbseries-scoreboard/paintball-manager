<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>IPBA Roster Lineup</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="roster-core.js?v=1"></script>
    <script src="roster-storage.js?v=1"></script>
    <style>
        :root { --cyan:#22d3ee; --amber:#fbbf24; }
        * { box-sizing:border-box; }
        html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent!important; }
        body { font-family:'Oswald','Arial Narrow',sans-serif; color:#fff; }
        #viewport { position:fixed; inset:0; overflow:hidden; background:transparent; }
        #stage { position:absolute; width:1920px; height:1080px; transform-origin:top left; opacity:1; transition:opacity .45s ease,transform .55s cubic-bezier(.2,.75,.2,1); }
        #stage.preview-dark { background:radial-gradient(circle at 50% 45%,#1e293b 0,#020617 70%); }
        #stage.preview-light { background:linear-gradient(135deg,#cbd5e1,#f8fafc); }
        #stage.preview-field { background:linear-gradient(rgba(2,6,23,.28),rgba(2,6,23,.68)),repeating-linear-gradient(90deg,#14532d 0,#14532d 120px,#166534 120px,#166534 240px); }
        #stage.preview-grid { background-color:#e5e7eb; background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%),linear-gradient(-45deg,#cbd5e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd5e1 75%),linear-gradient(-45deg,transparent 75%,#cbd5e1 75%); background-size:32px 32px; background-position:0 0,0 16px,16px -16px,-16px 0; }
        #stage.hidden { opacity:0; transform:scale(.985); pointer-events:none; }
        #roster { position:absolute; inset:32px 30px 28px; display:grid; grid-template-columns:1fr; gap:28px; }
        #roster.dual { grid-template-columns:minmax(0,1fr) 3px minmax(0,1fr); gap:20px; }
        .divider { display:none; align-self:stretch; background:linear-gradient(transparent,rgba(34,211,238,.9) 14%,rgba(251,191,36,.9) 50%,rgba(34,211,238,.9) 86%,transparent); box-shadow:0 0 18px rgba(34,211,238,.42); position:relative; opacity:0; transition:opacity .45s ease 1.1s; }
        .dual .divider { display:block; }
        .divider::after { content:'VS'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); padding:10px 7px; border:2px solid var(--cyan); border-radius:9px; background:rgba(2,6,23,.94); color:var(--amber); font-size:25px; font-weight:700; box-shadow:0 0 20px rgba(34,211,238,.35); }
        #stage.playing .divider { opacity:1; }
        .team-panel { min-width:0; height:100%; display:grid; grid-template-rows:130px minmax(0,1fr) 34px; border-radius:26px; position:relative; padding:0 12px 8px; --team-primary:#22d3ee; --team-secondary:#fbbf24; opacity:1; transition:opacity .35s ease,transform .45s ease; }
        .team-panel::before { content:''; position:absolute; inset:0; border-radius:26px; pointer-events:none; background:linear-gradient(180deg,color-mix(in srgb,var(--team-primary) 19%,transparent),transparent 23%,transparent 82%,color-mix(in srgb,var(--team-secondary) 10%,transparent)); border-top:3px solid var(--team-primary); border-bottom:1px solid color-mix(in srgb,var(--team-primary) 45%,transparent); }
        .team-panel.side-a::after,.team-panel.side-b::after { content:''; position:absolute; top:44px; width:190px; height:80%; pointer-events:none; opacity:.16; filter:blur(40px); background:var(--team-primary); }
        .team-panel.side-a::after { left:-80px; }.team-panel.side-b::after { right:-80px; }
        .team-panel.team-hidden { opacity:0; transform:translateX(var(--hide-x)); pointer-events:none; }
        .side-a { --hide-x:-100px; }.side-b { --hide-x:100px; }
        .team-header { display:grid; grid-template-columns:108px minmax(0,1fr); gap:18px; align-items:center; margin:13px 12px 5px; padding:10px 18px; border-radius:20px; background:linear-gradient(90deg,rgba(2,6,23,.94),rgba(15,23,42,.74),rgba(2,6,23,.3)); border-left:6px solid var(--team-primary); box-shadow:0 10px 28px rgba(0,0,0,.28); transform:translateY(-24px); opacity:0; }
        .side-b .team-header { grid-template-columns:minmax(0,1fr) 108px; text-align:right; border-left:0; border-right:6px solid var(--team-primary); background:linear-gradient(270deg,rgba(2,6,23,.94),rgba(15,23,42,.74),rgba(2,6,23,.3)); }
        #stage.playing .team-header { animation:headerIn .62s cubic-bezier(.2,.78,.2,1) forwards; }
        .side-b .team-header { animation-delay:.12s!important; }
        .team-logo { width:100px; height:100px; object-fit:contain; filter:drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
        .logo-placeholder { width:96px; height:96px; border-radius:22px; display:grid; place-items:center; font-size:35px; color:var(--team-secondary); background:rgba(15,23,42,.78); border:2px solid var(--team-primary); }
        .team-kicker { color:var(--team-secondary); font-size:17px; letter-spacing:5px; line-height:1; }
        .team-name { margin-top:5px; font-size:42px; line-height:1; font-weight:700; text-transform:uppercase; text-shadow:0 4px 11px #000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .team-company { margin-top:7px; color:#cbd5e1; font:500 15px/1.1 Arial,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .players-grid { min-height:0; height:100%; align-self:stretch; justify-self:stretch; display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); grid-template-rows:repeat(var(--rows),minmax(0,1fr)); gap:var(--gap,12px); align-content:center; justify-content:center; padding:7px 3px; }
        .player { position:relative; min-width:0; min-height:0; overflow:hidden; border-radius:18px; background:linear-gradient(180deg,rgba(15,23,42,.12),rgba(15,23,42,.84) 66%,rgba(2,6,23,.97)); border:1px solid color-mix(in srgb,var(--team-primary) 45%,rgba(255,255,255,.18)); box-shadow:0 12px 25px rgba(0,0,0,.32); opacity:0; transform:translateY(48px) scale(.9); }
        #stage.playing .player { animation:playerIn .58s cubic-bezier(.18,.8,.2,1) forwards; animation-delay:var(--delay); }
        .portrait { position:absolute; z-index:1; top:0; left:5%; width:90%; height:var(--portrait,72%); overflow:hidden; border-radius:15px 15px 4px 4px; }
        .portrait::after { content:''; position:absolute; inset:auto 0 0; height:32%; background:linear-gradient(transparent,rgba(2,6,23,.9)); pointer-events:none; }
        .portrait img { position:absolute; left:0; top:calc(var(--crop-top,0) * -1%); width:100%; height:calc(112% + var(--crop-bottom,12) * 1%); object-fit:cover; object-position:center 8%; transform:translate(calc(var(--offset-x,0) * 1%),calc(var(--offset-y,0) * 1%)) scale(var(--photo-scale,1)); transform-origin:center top; }
        .portrait img.contain { object-fit:contain; }
        .portrait img.flip { transform:translate(calc(var(--offset-x,0) * 1%),calc(var(--offset-y,0) * 1%)) scale(calc(var(--photo-scale,1) * -1),var(--photo-scale,1)); }
        .portrait img.shadow { filter:drop-shadow(0 8px 9px rgba(0,0,0,.65)); }
        .portrait img.glow { filter:drop-shadow(0 0 12px color-mix(in srgb,var(--team-primary) 55%,transparent)) drop-shadow(0 8px 9px rgba(0,0,0,.55)); }
        .portrait-placeholder { position:absolute; inset:8% 15% 0; border-radius:50% 50% 22% 22%; background:linear-gradient(180deg,#475569,#0f172a); display:grid; place-items:center; color:#94a3b8; font-size:64px; border:2px solid rgba(255,255,255,.15); }
        .player-meta { position:absolute; z-index:3; left:0; right:0; bottom:0; min-height:34%; padding:9px 9px 8px; display:grid; grid-template-columns:52px minmax(0,1fr); gap:7px; align-items:end; background:linear-gradient(90deg,color-mix(in srgb,var(--team-primary) 18%,rgba(2,6,23,.97)),rgba(2,6,23,.98)); border-top:2px solid var(--team-primary); }
        .player-number { color:var(--team-secondary); font-size:var(--num-size,34px); line-height:1; font-weight:700; text-align:center; text-shadow:0 2px 7px #000; }
        .player-name { font-size:var(--name-size,20px); line-height:1.02; text-transform:uppercase; font-weight:700; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .player-role { color:var(--team-primary); font-size:var(--role-size,14px); line-height:1; letter-spacing:2px; margin-top:5px; text-transform:uppercase; }
        .size-hero .players-grid { max-width:770px; margin:auto; --gap:32px; }.size-hero .player { min-height:730px; }.size-hero .player-meta{grid-template-columns:100px 1fr;padding:18px;}.size-hero{--num-size:65px;--name-size:39px;--role-size:24px;--portrait:79%;}
        .size-large .players-grid { max-width:820px; margin:auto; --gap:22px; }.size-large{--num-size:48px;--name-size:29px;--role-size:19px;--portrait:76%;}
        .size-medium{--num-size:42px;--name-size:25px;--role-size:17px;--portrait:75%;}
        .size-compact{--num-size:36px;--name-size:21px;--role-size:15px;--portrait:72%;}
        .size-dense{--num-size:31px;--name-size:18px;--role-size:13px;--portrait:70%;}.size-dense .player-meta{grid-template-columns:44px 1fr;padding:7px;}
        .page-status { align-self:center; text-align:center; font-size:15px; letter-spacing:3px; color:#94a3b8; opacity:0; }
        .page-status.visible { opacity:1; }
        #error { position:absolute; inset:0; display:none; place-items:center; padding:100px; text-align:center; background:rgba(2,6,23,.9); color:#fecaca; font-size:36px; z-index:20; }
        #loading { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--cyan); letter-spacing:5px; font-size:26px; z-index:15; }
        .compact-mode .team-header { height:104px; margin-top:5px; }.compact-mode .team-panel{grid-template-rows:112px minmax(0,1fr) 24px}.compact-mode .team-logo{height:82px}.compact-mode .logo-placeholder{height:80px}.compact-mode .team-name{font-size:34px}
        @keyframes headerIn { to { opacity:1; transform:translateY(0); } }
        @keyframes playerIn { to { opacity:1; transform:translateY(0) scale(1); } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
    </style>
</head>
<body>
    <div id="viewport"><main id="stage"><div id="loading">CARICAMENTO ROSE...</div><div id="roster"></div><div id="error"></div></main></div>
    <script>
        'use strict';
        const Core = IPBARosterCore, Storage = IPBARosterStorage;
        const params = new URLSearchParams(location.search);
        const idSingle = Core.safeTeamId(params.get('id'));
        const idA = Core.safeTeamId(params.get('idA')) || idSingle;
        const idB = Core.safeTeamId(params.get('idB'));
        const dual = params.get('mode') === 'dual' || !!(idA && idB);
        const preview = params.get('preview') === '1';
        const autoplay = params.get('autoplay') !== '0';
        const compact = params.get('compact') === '1';
        const stay = Math.max(0, Math.min(300000, parseInt(params.get('stay'),10) || 0));
        const stage = document.getElementById('stage'), rosterEl = document.getElementById('roster');
        let rosters = { A:null, B:null }, page = { A:0, B:0 }, mode = dual ? 'BOTH' : 'A', hideTimer = null, pollTimer = null;

        function scaleStage() {
            const scale = Math.min(innerWidth/1920,innerHeight/1080);
            stage.style.transform = 'translate(' + ((innerWidth-1920*scale)/2) + 'px,' + ((innerHeight-1080*scale)/2) + 'px) scale(' + scale + ')';
        }
        addEventListener('resize',scaleStage); scaleStage();
        if (preview) stage.classList.add('preview-dark');
        if (compact) stage.classList.add('compact-mode');

        function logoNode(team) {
            const url = team.customLogoUrl || team.originalLogoUrl;
            if (url) { const img=document.createElement('img'); img.className='team-logo'; img.src=url; img.alt=''; return img; }
            const ph=document.createElement('div'); ph.className='logo-placeholder'; ph.textContent=(team.name||'T').slice(0,1).toUpperCase(); return ph;
        }

        async function playerCard(player,index,side) {
            const data=Core.displayData(player), card=document.createElement('article'); card.className='player';
            const row=Core.inferredRow(player), rowDelay={POSTERIORE:0,CENTRALE:140,ANTERIORE:280}[row]||0;
            card.style.setProperty('--delay',(520+rowDelay+(index%4)*75+(side==='B'?80:0))+'ms');
            const portrait=document.createElement('div'); portrait.className='portrait';
            const imageUrl=await Storage.resolvePlayerImage(player);
            if (imageUrl) {
                const img=document.createElement('img'); img.src=imageUrl; img.alt=''; img.decoding='async';
                if (player.image.hasTransparency) img.classList.add('contain');
                if (player.image.flipX) img.classList.add('flip');
                if (player.image.glow) img.classList.add('glow'); else if (player.image.shadow) img.classList.add('shadow');
                img.style.setProperty('--photo-scale',player.image.scale); img.style.setProperty('--offset-x',player.image.offsetX);
                img.style.setProperty('--offset-y',player.image.offsetY); img.style.setProperty('--crop-top',player.image.cropTop);
                img.style.setProperty('--crop-bottom',player.image.cropBottom); portrait.style.setProperty('--portrait',player.image.bustHeight+'%'); portrait.appendChild(img);
            } else { const ph=document.createElement('div'); ph.className='portrait-placeholder'; ph.textContent=(data.name||'?').slice(0,1); portrait.appendChild(ph); }
            const meta=document.createElement('div'); meta.className='player-meta';
            const num=document.createElement('div'); num.className='player-number'; num.textContent=data.number||'—';
            const words=document.createElement('div'), name=document.createElement('div'); name.className='player-name'; name.textContent=data.name;
            const role=document.createElement('div'); role.className='player-role'; role.textContent=data.role||'GIOCATORE';
            words.append(name,role); meta.append(num,words); card.append(portrait,meta); return card;
        }

        async function teamPanel(roster,side) {
            const ordered=Core.orderedPlayers(roster), pages=[]; for(let i=0;i<ordered.length;i+=12) pages.push(ordered.slice(i,i+12));
            if(!pages.length) pages.push([]); page[side]=Math.min(page[side],pages.length-1);
            const players=pages[page[side]], spec=Core.layoutSpec(players.length);
            const panel=document.createElement('section'); panel.className='team-panel side-'+side.toLowerCase()+' size-'+spec.size;
            panel.dataset.side=side; panel.style.setProperty('--team-primary',roster.team.primaryColor); panel.style.setProperty('--team-secondary',roster.team.secondaryColor);
            const header=document.createElement('header'); header.className='team-header';
            const text=document.createElement('div'), kicker=document.createElement('div'); kicker.className='team-kicker'; kicker.textContent=roster.team.title||'ROSTER';
            const name=document.createElement('div'); name.className='team-name'; name.textContent=roster.team.name;
            const company=document.createElement('div'); company.className='team-company'; company.textContent=roster.team.companyName||('SQUADRA '+roster.team.id);
            text.append(kicker,name,company); const logo=logoNode(roster.team); if(side==='B') header.append(text,logo); else header.append(logo,text);
            const grid=document.createElement('div'); grid.className='players-grid'; grid.style.setProperty('--cols',spec.columns); grid.style.setProperty('--rows',spec.rows);
            const cards=await Promise.all(players.map((player,index)=>playerCard(player,index,side))); cards.forEach(card=>grid.appendChild(card));
            const status=document.createElement('div'); status.className='page-status'+(pages.length>1?' visible':''); status.textContent=pages.length>1?('PAGINA '+(page[side]+1)+' / '+pages.length):'';
            panel.append(header,grid,status); return panel;
        }

        async function render(playAnimation) {
            document.getElementById('loading').style.display='block'; rosterEl.replaceChildren(); rosterEl.className=dual?'dual':'';
            const panels=[];
            if(rosters.A) panels.push(await teamPanel(rosters.A,'A'));
            if(dual){ const divider=document.createElement('div'); divider.className='divider'; if(panels.length) rosterEl.append(panels[0],divider); else rosterEl.append(divider); if(rosters.B) rosterEl.append(await teamPanel(rosters.B,'B')); }
            else if(panels.length) rosterEl.append(panels[0]);
            applyMode(); document.getElementById('loading').style.display='none';
            if(playAnimation!==false) replay(); else stage.classList.add('playing');
        }

        function applyMode(){ rosterEl.querySelectorAll('.team-panel').forEach(panel=>panel.classList.toggle('team-hidden',mode!=='BOTH'&&panel.dataset.side!==mode)); }
        function replay(){ clearTimeout(hideTimer); stage.classList.remove('hidden','playing'); void stage.offsetWidth; stage.classList.add('playing'); if(stay) hideTimer=setTimeout(hideRoster,stay); }
        function showRoster(){ stage.classList.remove('hidden'); replay(); }
        function hideRoster(){ stage.classList.add('hidden'); }
        function setMode(value){ mode=value; applyMode(); showRoster(); }
        function changePage(delta){ ['A','B'].forEach(side=>{ if(!rosters[side])return; const total=Math.max(1,Math.ceil(Core.orderedPlayers(rosters[side]).length/12)); page[side]=(page[side]+delta+total)%total; }); render(true); }
        async function refresh(){
            try{
                const jobs=[]; if(idA) jobs.push(Storage.loadTeam(idA).then(result=>rosters.A=result.roster)); if(idB) jobs.push(Storage.loadTeam(idB).then(result=>rosters.B=result.roster));
                if(!jobs.length) throw new Error('Aggiungi ?id=2 oppure ?idA=2&idB=5 all’URL.'); await Promise.all(jobs); await render(autoplay);
            }catch(error){ const box=document.getElementById('error'); box.textContent=error.message; box.style.display='grid'; document.getElementById('loading').style.display='none'; }
        }
        function previewBackground(value){ stage.classList.remove('preview-dark','preview-light','preview-field','preview-grid'); if(value&&value!=='transparent') stage.classList.add('preview-'+value); }
        function command(packet){
            const type=typeof packet==='string'?packet:packet&&packet.type;
            if(type==='SHOW_ROSTER')showRoster(); else if(type==='HIDE_ROSTER')hideRoster(); else if(type==='REPLAY_ANIMATION')replay(); else if(type==='REFRESH_ROSTER')refresh();
            else if(type==='SHOW_TEAM_A')setMode('A'); else if(type==='SHOW_TEAM_B')setMode('B'); else if(type==='SHOW_BOTH_TEAMS')setMode('BOTH');
            else if(type==='NEXT_ROSTER_PAGE')changePage(1); else if(type==='PREVIOUS_ROSTER_PAGE')changePage(-1); else if(type==='ROSTER_PREVIEW_BACKGROUND')previewBackground(packet.value);
        }
        addEventListener('message',event=>{ if(event.origin===location.origin||event.origin==='null')command(event.data); });
        const channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('ipba_roster_setup'):null;
        if(channel)channel.onmessage=event=>{ const packet=event.data||{}; if(['ROSTER_CONFIG_UPDATED','PLAYER_IMAGE_UPDATED','PLAYER_DATA_UPDATED','ROSTER_ORDER_UPDATED','DUAL_ROSTER_UPDATED','REFRESH_ROSTER'].includes(packet.type)&&(!packet.teamId||packet.teamId===idA||packet.teamId===idB))refresh(); else command(packet); };
        pollTimer=setInterval(async()=>{ try{ const oldA=rosters.A&&rosters.A.updatedAt,oldB=rosters.B&&rosters.B.updatedAt; const jobs=[]; if(idA)jobs.push(Storage.loadTeam(idA,{noImport:true}).then(r=>rosters.A=r.roster)); if(idB)jobs.push(Storage.loadTeam(idB,{noImport:true}).then(r=>rosters.B=r.roster)); await Promise.all(jobs); if((rosters.A&&rosters.A.updatedAt)!==oldA||(rosters.B&&rosters.B.updatedAt)!==oldB)render(false); }catch(error){} },15000);
        addEventListener('beforeunload',()=>{clearInterval(pollTimer);if(channel)channel.close();});
        refresh();
    </script>
</body>
</html>
