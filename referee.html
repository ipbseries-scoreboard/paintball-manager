<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Referee Field Control - IPBA</title>
    <script src="lib/peerjs.min.js"></script>
    <script>window.Peer || document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"><\/script>');</script>
    <script src="pm-client.js?v=2.1.1-controller-cloud"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap"
        rel="stylesheet">
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const stack = error && error.stack ? ("\n\nStack: " + error.stack.split('\n').slice(0, 3).join('\n')) : "";
            const detail = `\nURL: ${url}\nPos: ${line}:${col}${stack}`;
            // Niente alert: un popup bloccante sul tablet arbitro a metà gara
            // è peggio dell'errore stesso. Tutto in console + barra di stato.
            console.error("CRITICAL ERROR:", msg, detail);
            try {
                if (typeof setStatus === 'function') setStatus("Errore JS: " + msg, "var(--danger)");
            } catch (e) { }
            return false;
        };
    </script>
    <style>
        :root {
            --bg-color: #000000;
            --btn-left: #3b82f6;
            --btn-right: #ef4444;
            --btn-accent: #22d3ee;
            --text-color: #ffffff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* CONNECT UI */
        #connect-ui {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 30000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            /* Scale 25% down */
            width: 133.33%;
            height: 133.33%;
            transform: scale(0.75);
            transform-origin: top left;
        }

        #connect-ui input {
            width: 100%;
            max-width: 300px;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #333;
            background: #111;
            color: white;
            font-size: 24px;
            text-align: center;
        }

        #connect-ui button {
            width: 100%;
            max-width: 300px;
            padding: 20px;
            border-radius: 12px;
            border: none;
            background: var(--btn-accent);
            color: black;
            font-weight: 900;
            font-size: 20px;
        }

        /* MAIN APP UI */
        #app {
            display: none;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            width: 133.33%;
            height: 133.33%;
            transform: scale(0.75);
            transform-origin: top left;
            box-sizing: border-box;
        }

        /* TABLET LAYOUT OVERRIDES */
        #app.layout-tablet {
            /* Controlled by JS */
            grid-template-areas:
                "timer timer"
                "left right"
                "bottom bottom";
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
        }

        #app.layout-tablet #timer {
            grid-area: timer;
            font-size: 150px;
        }

        #app.layout-tablet #section-left {
            grid-area: left;
        }

        #app.layout-tablet #section-right {
            grid-area: right;
        }

        #app.layout-tablet .bottom-bar {
            grid-area: bottom;
        }

        #app.layout-tablet .team-name {
            font-size: 50px;
        }

        #app.layout-tablet .team-score {
            font-size: 140px;
        }

        #app.layout-tablet .btn-point {
            height: 120px;
            font-size: 40px;
        }

        #app.layout-tablet .btn-special {
            font-size: 24px;
        }

        #app.layout-tablet .btn-pen {
            font-size: 30px;
            padding: 20px 0;
        }

        #app.layout-tablet .btn-main {
            height: 110px;
            font-size: 40px;
        }

        /* Smartphone layout is default (v2) */

        /* CONNECTION STATUS BAR */
        #connection-status {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #ef4444;
            z-index: 99999;
            transition: all 0.3s ease;
        }

        #connection-status.online {
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e;
        }

        #command-feedback {
            position: fixed;
            top: 14px;
            left: 50%;
            z-index: 20000;
            display: none;
            max-width: calc(100vw - 190px);
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #172033;
            color: white;
            font-size: 15px;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            transform: translateX(-50%);
            pointer-events: none;
        }

        #command-feedback.sending {
            display: block;
            border-color: var(--warning);
            color: #fbbf24;
        }

        #command-feedback.success {
            display: block;
            border-color: var(--success);
            background: #052e16;
            color: #86efac;
        }

        #command-feedback.failure {
            display: block;
            border-color: var(--danger);
            background: #450a0a;
            color: #fecaca;
        }

        .modal-btn:disabled {
            opacity: 0.45;
            cursor: wait;
        }

        @media (max-width: 600px) {
            #command-feedback {
                top: 12px;
                left: 12px;
                max-width: calc(100vw - 95px);
                padding: 8px 10px;
                font-size: 13px;
                transform: none;
            }
        }

        /* TIMER AREA */
        #timer-container {
            display: flex;
            background: #111;
            border-radius: 15px;
            border: 5px solid #333;
            padding: 10px;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .ref-settings-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9000;
            border: 2px solid #64748b;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.92);
            color: #e2e8f0;
            padding: 10px 14px;
            font-size: 16px;
            font-weight: 900;
        }

        #timer {
            font-size: 110px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            line-height: 1;
            color: var(--warning);
        }

        #timer-phase {
            font-size: 30px;
            font-weight: 900;
            color: var(--btn-accent);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            border-left: 2px solid #333;
            padding-left: 10px;
        }

        /* TEAMS VERTICAL STACK */
        .team-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            background: #111;
            border-radius: 20px;
            padding: 12px;
            border-left: 15px solid #ccc;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 5px;
        }

        .team-name {
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: normal;
            line-height: 1.1;
            flex: 1;
            color: #fff;
        }

        .team-score {
            font-size: 80px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            line-height: 1;
        }

        /* ACTION GRID inside team section */
        .action-row {
            display: flex;
            gap: 8px;
            height: 80px;
        }

        .btn-point {
            flex: 2;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
        }

        .btn-left {
            background: var(--btn-left);
        }

        .btn-right {
            background: var(--btn-right);
        }

        .btn-special {
            flex: 1;
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
        }

        .penalty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-pen {
            padding: 12px 0;
            border-radius: 12px;
            border: 2px solid #444;
            background: #222;
            color: #fbbf24;
            font-weight: 900;
            font-size: 20px;
        }

        .tech-indicator {
            grid-column: span 3;
            background: rgba(14, 165, 233, 0.2);
            border: 1px solid #0ea5e9;
            color: #0ea5e9;
            text-align: center;
            padding: 5px;
            font-weight: 900;
            font-size: 14px;
            border-radius: 8px;
            visibility: hidden;
            margin-top: 5px;
        }

        /* BOTTOM CONTROLS */
        .bottom-bar {
            display: flex;
            gap: 8px;
        }

        .btn-main {
            flex: 1;
            height: 90px;
            border-radius: 15px;
            border: none;
            font-weight: 900;
            font-size: 28px;
            text-transform: uppercase;
        }

        .btn-undo {
            flex: 0 0 70px;
            background: #475569;
            color: white;
            border-radius: 15px;
            border: none;
            font-size: 24px;
        }

        /* NEXT MATCH BOX (BOTTOM RIGHT) */
        .next-match-box {
            flex: 2.5;
            background: #1e293b;
            border-radius: 15px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 5px solid var(--warning);
            min-width: 0;
            /* Allow truncation */
        }

        .next-match-label {
            font-size: 16px;
            font-weight: 900;
            color: var(--warning);
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .next-match-info {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
            margin-top: 2px;
            line-height: 1;
        }

        .next-match-timer {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            color: #fbbf24;
            font-size: 36px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            line-height: 1;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: var(--btn-accent);
            margin-bottom: 20px;
        }

        .modal-btn {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            border: none;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: normal;
            line-height: 1.2;
        }

        .btn-confirm {
            background: var(--success);
            color: white;
        }

        .btn-reverse {
            background: var(--danger);
            color: white;
        }

        .btn-reject {
            background: #475569;
            color: white;
        }

        .btn-nopoint {
            background: #f59e0b;
            color: black;
        }

        .btn-cancel {
            background: #1e293b;
            color: #94a3b8;
            font-size: 18px;
            padding: 15px;
        }

        /* Conditional colors */
        .bg-active {
            background: var(--success) !important;
            color: black !important;
        }

        .bg-pause {
            background: var(--warning) !important;
            color: white !important;
        }

        .layout-selector {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 5px;
        }

        #connect-ui .layout-btn {
            flex: 1;
            padding: 25px 15px;
            border-radius: 12px;
            border: 3px solid #333;
            background: #111;
            color: #64748b;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        #connect-ui .layout-btn.selected {
            border-color: var(--btn-accent);
            color: black !important;
            background: var(--btn-accent) !important;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }

        #connect-ui .layout-btn span {
            font-size: 30px;
        }

        @keyframes flash-yellow {

            0%,
            100% {
                background: transparent;
            }

            50% {
                background: #f59e0b;
                color: black;
            }
        }

        @keyframes flash-red {

            0%,
            100% {
                background: transparent;
            }

            50% {
                background: #ef4444;
                color: white;
            }
        }

        .flash-yellow {
            animation: flash-yellow 1s ease 5;
            border-radius: 8px;
        }

        .flash-red {
            animation: flash-red 1s ease 5;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div id="connection-status"></div>
    <div id="command-feedback" role="status" aria-live="assertive"></div>
    <div id="connect-ui">
        <h1 style="font-family: 'Oswald'; font-size: 40px; margin: 0;">REFEREE CONTROL</h1>
        <input type="text" id="host-id" placeholder="MATCH ID">
        <input type="password" id="control-pin" placeholder="PIN CONTROLLO" inputmode="numeric"
            autocomplete="one-time-code" maxlength="6">
        <div id="my-id-display" style="color: #475569; font-size: 11px;">Inserisci il MATCH ID e premi CONNETTI</div>

        <div
            style="font-weight: 900; color: #94a3b8; margin-top: 10px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">
            Seleziona Layout</div>
        <div class="layout-selector">
            <button id="btn-layout-phone" class="layout-btn selected" onclick="setLayout('phone')">
                <span>📱</span> PHONE
            </button>
            <button id="btn-layout-tablet" class="layout-btn" onclick="setLayout('tablet')">
                <span>📟</span> TABLET
            </button>
        </div>

        <button id="btn-connect" onclick="connectToHost()">CONNETTI</button>
        <div id="connect-status-text" style="color: #64748b; font-size: 14px; font-weight: bold;">Pronto</div>
    </div>

    <div id="app">
        <button class="ref-settings-btn" onclick="openSettings()" aria-label="Impostazioni intervalli">⚙ INTERVALLI</button>
        <div id="timer-container">
            <div id="timer">00:00</div>
            <div id="timer-phase">GARA</div>
        </div>

        <!-- TEAM LEFT -->
        <div id="section-left" class="team-section" style="border-color: var(--btn-left);">
            <div class="team-header">
                <div id="name-left" class="team-name">TEAM LEFT</div>
                <div id="score-left" class="team-score">0</div>
            </div>
            <div class="action-row">
                <button class="btn-point btn-left" onclick="openPointModal('left')">+1 PUNTO</button>
                <button id="spec-left" class="btn-special" onclick="handleSpecial('left')">TOWEL</button>
            </div>
            <div class="penalty-grid">
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'left', 1)">1x1</button>
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'left', 2)">2x1</button>
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'left', 3)">3x1</button>
                <div id="tech-ind-left" class="tech-indicator">PAUSA TECNICA USATA</div>
            </div>
        </div>

        <!-- TEAM RIGHT -->
        <div id="section-right" class="team-section" style="border-color: var(--btn-right);">
            <div class="team-header">
                <div id="name-right" class="team-name">TEAM RIGHT</div>
                <div id="score-right" class="team-score">0</div>
            </div>
            <div class="action-row">
                <button class="btn-point btn-right" onclick="openPointModal('right')">+1 PUNTO</button>
                <button id="spec-right" class="btn-special" onclick="handleSpecial('right')">TOWEL</button>
            </div>
            <div class="penalty-grid">
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'right', 1)">1x1</button>
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'right', 2)">2x1</button>
                <button class="btn-pen" onclick="sendCommand('PENALTY', 'right', 3)">3x1</button>
                <div id="tech-ind-right" class="tech-indicator">PAUSA TECNICA USATA</div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="pause-btn" class="btn-main" onclick="handlePauseToggle()">START</button>
            <div id="next-match-panel" class="next-match-box">
                <div class="next-match-label">
                    <span>NEXT MATCH</span>
                    <span id="nm-timer" class="next-match-timer"></span>
                </div>
                <div id="nm-info" class="next-match-info">-- vs --</div>
            </div>
        </div>
    </div>

    <!-- POINT CONFIRMATION MODAL -->
    <div id="point-modal" class="modal">
        <div id="modal-team-name" class="modal-title">VERIFICA PUNTO</div>
        <button class="modal-btn btn-confirm" data-point-decision="APPROVED" onclick="submitPoint('APPROVED')">CONFIRMED POINT</button>
        <button class="modal-btn btn-reverse" data-point-decision="REVERSE" onclick="submitPoint('REVERSE')">REVERSE POINT</button>
        <button class="modal-btn btn-reject" data-point-decision="REJECT" onclick="submitPoint('REJECT')">POINT NOT APPROVED</button>
        <button class="modal-btn btn-nopoint" data-point-decision="NO_POINT" onclick="submitPoint('NO_POINT')">NO POINT</button>
        <button class="modal-btn btn-cancel" data-point-decision="REJECT" onclick="closeModal()">CANCEL / CLOSE</button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-title">IMPOSTAZIONI INTERVALLI</div>
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Int. Punto (sec)</label>
                <input type="number" id="point-interval-duration"
                    value="30" min="1"
                    style="width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white; text-align: center;">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Int. Slot (sec)</label>
                <input type="number" id="slot-interval-duration"
                    value="120" min="1"
                    style="width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white; text-align: center;">
            </div>
            <button class="modal-btn btn-confirm" style="margin-top: 20px;" onclick="saveSettings()">SALVA E
                SINCRONIZZA</button>
            <button class="modal-btn btn-cancel"
                onclick="document.getElementById('settings-modal').style.display='none'">CHIUDI</button>
        </div>
    </div>

    <script>
        const syncChannelAvailable = typeof BroadcastChannel === 'function';
        const syncChannel = syncChannelAvailable
            ? new BroadcastChannel('pm_sync')
            : { postMessage: () => { }, onmessage: null };

        // NEW: Zero-latency Local sync (Listen for state updates)
        syncChannel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            if (data.type === 'COMMAND_ACK') {
                handleCommandAck(data.payload || data);
            } else if (data.type === 'STATE_UPDATE') {
                updateUI(data.payload);
            }
        };

        let conn = null;
        let currentMode = 'IDLE';
        let pendingSide = null;
        let pointRequestPromise = null;
        let pointRequestPayload = null;
        let pointRequestAccepted = false;
        let pointDecisionPayload = null;
        let lockedPointDecision = null;
        let pointModalBusy = false;
        let chosenLayout = 'phone';
        let controlToken = '';
        let lastTimerSecond = -1;
        let lastPensLeft = 0;
        let lastPensRight = 0;
        let lastPenaltyTimeLeft = 0;
        let lastPenaltyTimeRight = 0;
        let vibrationEnabled = true; // Global flag
        const pendingCommands = new Map();
        const COMMAND_RETRY_DELAYS = [800, 1500, 3000, 5000];
        const CONTROL_PIN_STORAGE_KEY = 'pm_referee_control_pin';
        let feedbackHideTimer = null;

        function triggerVibration(pattern) {
            if (!vibrationEnabled) return;
            if ("vibrate" in navigator) {
                switch (pattern) {
                    case 'point': navigator.vibrate(100); break;
                    case 'warning': navigator.vibrate(500); break;
                    case 'end': navigator.vibrate([200, 100, 200, 100, 500]); break;
                }
            }
        }

        function setLayout(type) {
            chosenLayout = type;
            document.getElementById('btn-layout-phone').classList.toggle('selected', type === 'phone');
            document.getElementById('btn-layout-tablet').classList.toggle('selected', type === 'tablet');
        }

        function setStatus(msg, color = "#64748b") {
            const el = document.getElementById('connect-status-text');
            if (el) {
                el.innerText = msg;
                el.style.color = color;
            }
            console.log("STATUS:", msg);
        }

        function requestPinCorrection(message) {
            const connectUi = document.getElementById('connect-ui');
            const btnConnect = document.getElementById('btn-connect');
            connectUi.style.display = 'flex';
            btnConnect.disabled = false;
            btnConnect.innerText = 'RIPROVA';
            setStatus(message || 'Controlla il PIN controllo', 'var(--danger)');
            setTimeout(() => {
                const pinEl = document.getElementById('control-pin');
                if (pinEl) {
                    pinEl.focus();
                    pinEl.select();
                }
            }, 50);
        }

        function showCommandFeedback(kind, message, autoHideMs = 0) {
            const el = document.getElementById('command-feedback');
            if (!el) return;
            if (feedbackHideTimer) {
                clearTimeout(feedbackHideTimer);
                feedbackHideTimer = null;
            }
            el.className = kind || '';
            el.innerText = message || '';
            if (autoHideMs > 0) {
                feedbackHideTimer = setTimeout(() => {
                    if (pendingCommands.size === 0) {
                        el.className = '';
                        el.innerText = '';
                    }
                }, autoHideMs);
            }
        }

        function commandLabel(payload) {
            const labels = {
                POINT: 'VERIFICA PUNTO',
                CONFIRM_POINT: 'DECISIONE PUNTO',
                PENALTY: 'PENALITÀ',
                ACTION: 'TOWEL',
                TECH: 'PAUSA TECNICA',
                START_POINT: 'START',
                START_INTER: 'INTERVALLO',
                PAUSE: 'PAUSA/RIPRESA',
                UPDATE_SETTINGS: 'IMPOSTAZIONI'
            };
            return labels[payload.type] || payload.type || 'COMANDO';
        }

        function pinStorageKey(matchId) {
            const normalized = (window.PMClient && PMClient.normalizeId)
                ? PMClient.normalizeId(matchId)
                : String(matchId || '').trim().toUpperCase();
            return `${CONTROL_PIN_STORAGE_KEY}:${normalized || 'default'}`;
        }

        function rememberControlPin(matchId, pin) {
            try {
                localStorage.setItem(CONTROL_PIN_STORAGE_KEY, pin);
                localStorage.setItem(pinStorageKey(matchId), pin);
            } catch (err) {
                console.warn('Impossibile ricordare il PIN controllo:', err);
            }
        }

        function readRememberedControlPin(matchId) {
            try {
                return localStorage.getItem(pinStorageKey(matchId)) ||
                    localStorage.getItem(CONTROL_PIN_STORAGE_KEY) || '';
            } catch (err) {
                return '';
            }
        }

        function refreshPointModalButtons() {
            document.querySelectorAll('#point-modal .modal-btn').forEach(button => {
                const decision = button.dataset.pointDecision || '';
                button.disabled = pointModalBusy || (!!lockedPointDecision && decision !== lockedPointDecision);
            });
        }

        function setPointModalBusy(busy) {
            pointModalBusy = !!busy;
            refreshPointModalButtons();
        }

        function lockPointDecision(decision = null) {
            lockedPointDecision = decision || null;
            refreshPointModalButtons();
        }

        function settlePendingCommand(entry, result) {
            if (!entry || entry.settled) return;
            entry.settled = true;
            if (entry.timer) clearTimeout(entry.timer);
            pendingCommands.delete(entry.payload.commandId);
            entry.resolve(result);
        }

        function failPendingCommand(entry, reason) {
            if (!entry || entry.settled) return;
            const message = reason || 'nessuna risposta dalla Regia';
            settlePendingCommand(entry, {
                accepted: false,
                commandId: entry.payload.commandId,
                message: message,
                timedOut: true
            });
            showCommandFeedback('failure', `NON RICEVUTO · ${commandLabel(entry.payload)} · ${message}`, 8000);
            triggerVibration('warning');
        }

        function handleLatePointAck(ack) {
            const commandId = String(ack && ack.commandId || '');
            const isPointRequest = !!pointRequestPayload &&
                String(pointRequestPayload.commandId) === commandId;
            const isPointDecision = !!pointDecisionPayload &&
                String(pointDecisionPayload.commandId) === commandId;

            if (!isPointRequest && !isPointDecision) return false;

            const accepted = ack.accepted === true;
            const terminalRejection = isTerminalPointRejection(ack);
            const reason = ack.message || 'comando rifiutato dalla Regia';
            const payload = isPointDecision ? pointDecisionPayload : pointRequestPayload;

            if (accepted) {
                showCommandFeedback('success', `CONFERMATO · ${commandLabel(payload)}`, 1800);
                triggerVibration('point');
                if (isPointDecision) {
                    clearPointVerificationModal();
                } else {
                    pointRequestAccepted = true;
                    pointRequestPromise = null;
                    // Un duplicato tardivo del POINT può arrivare mentre la
                    // decisione è già in volo: in quel caso i tasti restano bloccati.
                    if (!pointDecisionPayload) setPointModalBusy(false);
                }
                return true;
            }

            showCommandFeedback('failure', `RIFIUTATO · ${commandLabel(payload)} · ${reason}`, 8000);
            triggerVibration('warning');
            if (/pin|credenzial|accesso negato/i.test(reason)) requestPinCorrection(reason);

            if (terminalRejection) {
                clearPointVerificationModal();
            } else {
                if (isPointDecision) lockPointDecision(pointDecisionPayload.decision);
                if (isPointDecision || !pointDecisionPayload) setPointModalBusy(false);
            }
            return true;
        }

        function handleCommandAck(ack) {
            if (!ack || ack.type !== 'COMMAND_ACK' || !ack.commandId) return false;
            const entry = pendingCommands.get(String(ack.commandId));
            if (!entry || entry.settled) {
                handleLatePointAck(ack);
                return true;
            }

            if (ack.accepted === true) {
                settlePendingCommand(entry, ack);
                showCommandFeedback('success', `CONFERMATO · ${commandLabel(entry.payload)}`, 1800);
                if (entry.payload.type === 'PENALTY' && entry.payload.side && entry.payload.level) {
                    triggerFlash(entry.payload.side, entry.payload.level == 1 ? 'yellow' : 'red');
                }
                if (entry.payload.type !== 'TIMER_SYNC') triggerVibration('point');
            } else {
                const reason = ack.message || 'comando rifiutato dalla Regia';
                settlePendingCommand(entry, ack);
                showCommandFeedback('failure', `RIFIUTATO · ${commandLabel(entry.payload)} · ${reason}`, 8000);
                triggerVibration('warning');
                if (/pin|credenzial|accesso negato/i.test(reason)) requestPinCorrection(reason);
            }
            return true;
        }

        function transmitPendingCommand(entry) {
            if (!entry || entry.settled) return;
            if (entry.timer) {
                clearTimeout(entry.timer);
                entry.timer = null;
            }

            entry.attempts += 1;
            let localAttempted = false;
            let networkSent = false;

            if (syncChannelAvailable) {
                try {
                    syncChannel.postMessage({ type: 'REMOTE_COMMAND', payload: entry.payload });
                    localAttempted = true;
                } catch (err) {
                    console.error('Invio locale fallito:', err);
                }
            }

            if (conn && conn.open) {
                try {
                    networkSent = conn.send(entry.payload) === true;
                } catch (err) {
                    console.error('Invio rete fallito:', err);
                }
            }

            const routeNote = networkSent ? '' : (localAttempted ? ' · rete in attesa' : ' · nessun collegamento');
            showCommandFeedback(
                'sending',
                `INVIO · ${commandLabel(entry.payload)} · tentativo ${entry.attempts}/${COMMAND_RETRY_DELAYS.length}${routeNote}`
            );

            const retryDelay = COMMAND_RETRY_DELAYS[Math.min(entry.attempts - 1, COMMAND_RETRY_DELAYS.length - 1)];
            entry.timer = setTimeout(() => {
                if (entry.settled) return;
                if (entry.attempts >= COMMAND_RETRY_DELAYS.length) {
                    failPendingCommand(entry, 'nessuna conferma dalla Regia');
                } else {
                    transmitPendingCommand(entry);
                }
            }, retryDelay);
        }

        function retryPendingCommandsNow() {
            pendingCommands.forEach(entry => {
                if (!entry.settled && entry.attempts < COMMAND_RETRY_DELAYS.length) {
                    entry.payload.controlToken = controlToken;
                    transmitPendingCommand(entry);
                }
            });
        }

        function handleIncomingData(data) {
            if (!data) return;
            if (data.type === 'COMMAND_ACK') {
                handleCommandAck(data.payload || data);
                return;
            }
            updateUI(data);
        }

        function connectToHost() {
            let idInput = document.getElementById('host-id').value.trim();
            if (!idInput) {
                setStatus("Inserisci un ID", "var(--danger)");
                return;
            }

            const pinInput = document.getElementById('control-pin').value.trim();
            if (!/^\d{6}$/.test(pinInput)) {
                setStatus("Inserisci un PIN di 6 cifre", "var(--danger)");
                showCommandFeedback('failure', 'PIN CONTROLLO: SERVONO 6 CIFRE', 6000);
                return;
            }
            controlToken = pinInput;
            rememberControlPin(idInput, controlToken);

            const btnConnect = document.getElementById('btn-connect');
            btnConnect.disabled = true;
            btnConnect.innerText = "ATTENDI...";
            setStatus("Inizializzazione rete...", "var(--btn-accent)");

            // Il trasporto (retry, PING/PONG, fallback locale->cloud) è gestito da pm-client.js
            if (conn) conn.destroy();
            conn = PMClient.connect({
                id: idInput,
                role: 'controller',
                token: controlToken,
                staleBadge: true,
                onStatus: (msg, isError) => {
                    setStatus(msg, isError ? "var(--danger)" : "var(--btn-accent)");
                    if (isError) {
                        btnConnect.disabled = false;
                        btnConnect.innerText = "RIPROVA";
                        showCommandFeedback('failure', msg, 6000);
                        if (/pin|credenzial|accesso negato/i.test(msg)) requestPinCorrection(msg);
                    }
                },
                onOpen: () => {
                    setStatus("Connesso!", "var(--success)");
                    const myIdEl = document.getElementById('my-id-display');
                    if (myIdEl) myIdEl.innerText = "Collegato via " + conn.transport;
                    document.getElementById('connect-ui').style.display = 'none';
                    const app = document.getElementById('app');
                    app.className = `layout-${chosenLayout}`;
                    app.style.display = (chosenLayout === 'tablet') ? 'grid' : 'flex';
                    document.getElementById('connection-status').classList.add('online');
                    btnConnect.disabled = false;
                    btnConnect.innerText = "CONNETTI";
                    if (pendingCommands.size > 0) retryPendingCommandsNow();
                    else showCommandFeedback('success', 'REGIA CONNESSA', 1600);
                },
                onClose: () => {
                    document.getElementById('connection-status').classList.remove('online');
                    showCommandFeedback('failure', 'REGIA DISCONNESSA · riconnessione in corso');
                },
                onData: handleIncomingData
            });
        }

        function smartTruncate(str, limit) {
            if (!str) return "";
            str = str.trim().toUpperCase();
            if (str.length <= limit) return str;

            const words = str.split(/\s+/).filter(w => w.length > 0);

            if (words.length >= 3) {
                const w1 = words[0].substring(0, 4);
                const w2Initial = words[1].substring(0, 1) + ".";
                const lastWord = words[words.length - 1];
                const prefix = w1 + " " + w2Initial + " ";
                const remaining = limit - prefix.length;
                return (prefix + (remaining > 0 ? lastWord.substring(0, remaining) : "")).trim();
            } else if (words.length === 2) {
                const w1 = words[0].substring(0, 4);
                const lastWord = words[1];
                const prefix = w1 + " ";
                const remaining = limit - prefix.length;
                return (prefix + (remaining > 0 ? lastWord.substring(0, remaining) : "")).trim();
            } else {
                return str.substring(0, limit);
            }
        }

        function updateUI(data) {
            try {
                if (!data) return;

                // Sync remote settings
                if (data.hapticReferee !== undefined) {
                    vibrationEnabled = data.hapticReferee;
                }

                // Update local inputs if they are not being edited
                if (document.getElementById('settings-modal').style.display !== 'flex') {
                    if (data.tournament && data.tournament.settings) {
                        const s = data.tournament.settings;
                        if (s.pointIntervalDuration !== undefined) document.getElementById('point-interval-duration').value = s.pointIntervalDuration;
                        if (s.slotIntervalDuration !== undefined) document.getElementById('slot-interval-duration').value = s.slotIntervalDuration;
                    }
                }

                if (data && data.type === 'PING') {
                    conn.send({ type: 'PONG', ts: data.ts });
                    return;
                }

                if (data.teamLeft && data.teamLeft.lastPenalty) {
                    const lp = data.teamLeft.lastPenalty;
                    if (lp.timestamp > lastPenaltyTimeLeft) {
                        const color = (lp.level == 1) ? 'yellow' : 'red';
                        triggerFlash('left', color);
                        lastPenaltyTimeLeft = lp.timestamp;
                    }
                }
                if (data.teamRight && data.teamRight.lastPenalty) {
                    const lp = data.teamRight.lastPenalty;
                    if (lp.timestamp > lastPenaltyTimeRight) {
                        const color = (lp.level == 1) ? 'yellow' : 'red';
                        triggerFlash('right', color);
                        lastPenaltyTimeRight = lp.timestamp;
                    }
                }

                document.getElementById('connection-status').classList.add('online');

                // Timer format MM:SS (strip milliseconds)
                const fullTime = data.timer || "00:00.00";
                const mmss = fullTime.split('.')[0];
                document.getElementById('timer').innerText = mmss;

                // Haptic Feedback for Timer
                const totalSeconds = parseTimerToSeconds(mmss);
                if (totalSeconds !== lastTimerSecond) {
                    if (totalSeconds === 10 && data.mode !== 'IDLE') triggerVibration('warning');
                    if (totalSeconds === 0 && lastTimerSecond === 1 && data.mode !== 'IDLE') triggerVibration('end');
                    lastTimerSecond = totalSeconds;
                }

                // Update Phase Label
                const phaseEl = document.getElementById('timer-phase');
                if (data.mode === 'INTERVAL' || data.mode === 'BREAK_MATCH' || data.mode === 'GOLDEN_BREAK') {
                    phaseEl.innerText = "Pausa";
                    phaseEl.style.color = "var(--warning)";
                } else {
                    phaseEl.innerText = "Gara";
                    phaseEl.style.color = "var(--btn-accent)";

                currentMode = data.mode;

                // Update Special Buttons (Towel vs Tech)
                const isPlay = (data.mode === 'POINT' || data.mode === 'OVERTIME');
                const specL = document.getElementById('spec-left');
                const specR = document.getElementById('spec-right');

                // Disable Score & Penalty Buttons when not playing
                const gameButtons = document.querySelectorAll('.btn-pen, .btn-point');
                gameButtons.forEach(b => {

                });

                if (isPlay) {
                    specL.innerText = "TOWEL";
                    specR.innerText = "TOWEL";
                    specL.style.background = "#64748b";
                    specR.style.background = "#64748b";
                } else {
                    specL.innerText = "TECH";
                    specR.innerText = "TECH";
                    specL.style.background = "#0ea5e9";
                    specR.style.background = "#0ea5e9";
                }

                if (data.teamLeft) {
                    document.getElementById('name-left').innerText = data.teamLeft.name;
                    document.getElementById('score-left').innerText = data.teamLeft.score;
                    document.getElementById('tech-ind-left').style.visibility = data.teamLeft.techUsed ? 'visible' : 'hidden';

                    // Remote penalty flash
                    const newPens = data.teamLeft.totalPenalties || 0;
                    lastPensLeft = newPens;
                }
                if (data.teamRight) {
                    document.getElementById('name-right').innerText = data.teamRight.name;
                    document.getElementById('score-right').innerText = data.teamRight.score;
                    document.getElementById('tech-ind-right').style.visibility = data.teamRight.techUsed ? 'visible' : 'hidden';

                    // Remote penalty flash
                    const newPens = data.teamRight.totalPenalties || 0;
                    lastPensRight = newPens;
                }

                // Update Main Button (Dynamic START/PAUSA)
                const mainBtn = document.getElementById('pause-btn');
                if (data.mode === 'POINT' || data.mode === 'OVERTIME') {
                    mainBtn.innerText = "PAUSA";
                    mainBtn.className = "btn-main bg-pause";
                } else if (data.mode === 'PAUSED' || data.mode === 'TECH_PAUSED') {
                    mainBtn.innerText = "RIPRENDI";
                    mainBtn.className = "btn-main bg-pause"; // Same warning color, but text is clearer
                    mainBtn.style.backgroundColor = '#ef4444'; // Force red background like index.html
                } else {
                    mainBtn.innerText = "START";
                    mainBtn.className = "btn-main bg-active";
                    mainBtn.style.backgroundColor = ''; // Clear inline styles
                }

                // Update Next Match Panel
                const nmPanel = document.getElementById('next-match-panel');
                if (data.nextMatch) {
                    nmPanel.style.display = 'flex';
                    const nmInfo = document.getElementById('nm-info');
                    const nmTimer = document.getElementById('nm-timer');

                    const nmLimit = 11;
                    const tATrunc = smartTruncate(data.nextMatch.teamA, nmLimit);
                    const tBTrunc = smartTruncate(data.nextMatch.teamB, nmLimit);

                    let teamsText = `${tATrunc} vs ${tBTrunc}`;

                    // Show scores if available (either started or having non-zero scores)
                    const hasScores = (data.nextMatch.scoreA > 0 || data.nextMatch.scoreB > 0 || data.nextMatch.isStarted);
                    if (hasScores) {
                        teamsText += ` [ ${data.nextMatch.scoreA} - ${data.nextMatch.scoreB} ]`;
                    }

                    if (data.nextMatch.isStarted) {
                        nmTimer.innerText = data.nextMatch.timer || "";
                        nmTimer.style.color = "#fbbf24";
                    } else {
                        nmTimer.innerText = data.nextMatch.time || "--:--";
                        nmTimer.style.color = "#94a3b8";
                    }
                    nmInfo.innerText = teamsText;
                } else {
                    nmPanel.style.display = 'none';
                }
            } catch (err) {
                console.error("UI Update Error:", err);
            }
        }

        function openPointModal(side) {
            if (pendingSide || pointModalBusy) {
                showCommandFeedback('failure', 'È GIÀ ATTIVA UNA VERIFICA PUNTO', 5000);
                return;
            }
            pendingSide = side;
            pointRequestPromise = null;
            pointRequestPayload = null;
            pointRequestAccepted = false;
            pointDecisionPayload = null;
            lockPointDecision(null);
            const name = side === 'left' ? document.getElementById('name-left').innerText : document.getElementById('name-right').innerText;
            document.getElementById('modal-team-name').innerText = `PUNTO PER: ${name}`;
            document.getElementById('point-modal').style.display = 'flex';
            setPointModalBusy(true);

            // Prima di accettare la decisione dell'arbitro, la Regia deve aver
            // confermato l'apertura della verifica punto.
            ensurePointRequestAcknowledged().then(result => {
                if (pendingSide === side) setPointModalBusy(false);
                if (!result.accepted && pendingSide === side) {
                    showCommandFeedback('failure', 'VERIFICA PUNTO NON APERTA · premi di nuovo una decisione per riprovare', 8000);
                }
            });
        }

        function closeModal() {
            return finishPointDecision('CONFIRM_POINT', 'REJECT');
        }

        function submitPoint(decision) {
            return finishPointDecision('CONFIRM_POINT', decision);
        }

        function ensurePointRequestAcknowledged() {
            if (!pendingSide) {
                return Promise.resolve({ accepted: false, message: 'nessun punto in verifica' });
            }
            if (pointRequestAccepted) {
                return Promise.resolve({ accepted: true, message: 'verifica già aperta' });
            }
            if (!pointRequestPromise) {
                const requestedSide = pendingSide;
                if (!pointRequestPayload) pointRequestPayload = createCommandPayload('POINT', requestedSide);
                pointRequestPromise = queueCommandPayload(pointRequestPayload).then(result => {
                    if (pendingSide === requestedSide) {
                        pointRequestAccepted = result.accepted === true;
                    }
                    pointRequestPromise = null;
                    return result;
                });
            }
            return pointRequestPromise;
        }

        function isTerminalPointRejection(result) {
            const message = String(result && result.message || '').toLowerCase();
            return result && result.accepted === false &&
                message.includes('verifica punto non') && message.includes('attiva');
        }

        function clearPointVerificationModal() {
            pendingSide = null;
            pointRequestPromise = null;
            pointRequestPayload = null;
            pointRequestAccepted = false;
            pointDecisionPayload = null;
            lockedPointDecision = null;
            pointModalBusy = false;
            refreshPointModalButtons();
            document.getElementById('point-modal').style.display = 'none';
        }

        function finishPointDecision(commandType, decision) {
            if (pointModalBusy || !pendingSide) {
                if (!pendingSide) showCommandFeedback('failure', 'NESSUN PUNTO IN VERIFICA', 5000);
                return Promise.resolve({ accepted: false, message: 'verifica non disponibile' });
            }

            const side = pendingSide;
            if (pointDecisionPayload && pointDecisionPayload.decision !== decision) {
                showCommandFeedback(
                    'failure',
                    `DECISIONE ${pointDecisionPayload.decision} GIÀ IN ATTESA · usa lo stesso pulsante per ritentare`,
                    8000
                );
                return Promise.resolve({ accepted: false, message: 'una diversa decisione è già in attesa' });
            }

            setPointModalBusy(true);
            return ensurePointRequestAcknowledged().then(openAck => {
                if (!openAck.accepted) return { stage: 'POINT', result: openAck };
                if (!pointDecisionPayload) {
                    pointDecisionPayload = createCommandPayload(commandType, side, null, decision);
                }
                return queueCommandPayload(pointDecisionPayload).then(result => ({ stage: 'DECISION', result }));
            }).then(outcome => {
                const result = outcome.result;
                const decisionFinished = outcome.stage === 'DECISION' &&
                    (result.accepted === true || isTerminalPointRejection(result));

                if (decisionFinished && pendingSide === side) {
                    clearPointVerificationModal();
                } else {
                    if (outcome.stage === 'DECISION' && pointDecisionPayload) {
                        lockPointDecision(pointDecisionPayload.decision);
                    }
                    setPointModalBusy(false);
                }
                return result;
            });
        }

        function parseTimerToSeconds(mmss) {
            if (!mmss) return -1;
            const pts = mmss.split(':');
            return (parseInt(pts[0]) * 60) + parseInt(pts[1]);
        }

        function handleSpecial(side) {
            if (currentMode === 'POINT' || currentMode === 'OVERTIME') {
                sendCommand('ACTION', side); // Action triggers Towel in POINT mode
            } else {
                sendCommand('TECH', side);
            }
        }

        function createCommandPayload(type, side, level, decision, extraSettings) {
            const sentAt = Date.now();
            const commandId = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
                ? crypto.randomUUID()
                : `${sentAt}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
            const payload = {
                type: type,
                side: side,
                level: level,
                decision: decision,
                commandId: commandId,
                sentAt: sentAt,
                controlToken: controlToken
            };
            if (extraSettings) payload.settings = extraSettings;
            return payload;
        }

        function queueCommandPayload(payload) {
            if (!controlToken) {
                const failure = { accepted: false, message: 'PIN controllo mancante' };
                showCommandFeedback('failure', 'COMANDO NON INVIATO · PIN CONTROLLO MANCANTE', 8000);
                return Promise.resolve(failure);
            }
            if (!payload || !payload.commandId) {
                return Promise.resolve({ accepted: false, message: 'payload comando non valido' });
            }

            const existing = pendingCommands.get(payload.commandId);
            if (existing && !existing.settled) return existing.promise;

            // Un ritento manuale conserva integralmente il comando originario.
            // L'unico campo aggiornabile è il PIN, nel caso sia stato corretto.
            payload.controlToken = controlToken;

            // Il PIN viaggia nel payload ma non deve finire nella console del browser.
            console.log("QUEUE COMMAND:", {
                type: payload.type,
                side: payload.side,
                level: payload.level,
                decision: payload.decision,
                commandId: payload.commandId,
                sentAt: payload.sentAt
            });

            let resolveCommand;
            const promise = new Promise(resolve => { resolveCommand = resolve; });
            const entry = {
                payload: payload,
                attempts: 0,
                timer: null,
                settled: false,
                resolve: resolveCommand,
                promise: promise
            };
            const commandId = payload.commandId;
            pendingCommands.set(commandId, entry);
            transmitPendingCommand(entry);
            return promise;
        }

        function sendCommand(type, side, level, decision, extraSettings) {
            return queueCommandPayload(createCommandPayload(type, side, level, decision, extraSettings));
        }

        function triggerFlash(side, color) {
            const targetId = `name-${side}`;
            const el = document.getElementById(targetId);
            if (el) {
                const flashClass = `flash-${color}`;
                el.classList.remove('flash-yellow', 'flash-red');
                void el.offsetWidth; // Trigger reflow
                el.classList.add(flashClass);
                setTimeout(() => el.classList.remove(flashClass), 5050);
            }
        }

        function handlePauseToggle() {
            if (currentMode === 'PAUSED' || currentMode === 'TECH_PAUSED') {
                sendCommand('PAUSE');
            } else if (currentMode === 'IDLE' || currentMode === 'INTERVAL' || currentMode === 'GOLDEN_BREAK') {
                sendCommand('START_POINT');
            } else if (currentMode === 'BREAK_MATCH') {
                sendCommand('START_INTER');
            } else {
                sendCommand('PAUSE');
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            const pointIntervalDuration = Number(document.getElementById('point-interval-duration').value);
            const slotIntervalDuration = Number(document.getElementById('slot-interval-duration').value);

            if (!Number.isFinite(pointIntervalDuration) || pointIntervalDuration <= 0 ||
                !Number.isFinite(slotIntervalDuration) || slotIntervalDuration <= 0) {
                alert('Inserisci durate positive valide per entrambi gli intervalli.');
                return;
            }

            sendCommand('UPDATE_SETTINGS', null, null, null, {
                pointIntervalDuration: pointIntervalDuration,
                slotIntervalDuration: slotIntervalDuration
            }).then(result => {
                if (result.accepted === true) {
                    document.getElementById('settings-modal').style.display = 'none';
                }
            });
        }

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || params.get('matchId');
        const pinFromUrl = params.get('pin');
        if (id) {
            document.getElementById('host-id').value = id;
        }
        const initialPin = pinFromUrl || readRememberedControlPin(id || 'default');
        if (initialPin) document.getElementById('control-pin').value = initialPin;
        if (pinFromUrl && id) rememberControlPin(id, pinFromUrl);

        // Dopo averlo memorizzato, togli il PIN dalla barra indirizzi e dalla
        // cronologia: il QR continua a funzionare, ma il segreto non resta visibile.
        if (pinFromUrl && window.history && typeof window.history.replaceState === 'function') {
            params.delete('pin');
            const cleanQuery = params.toString();
            const cleanUrl = window.location.pathname + (cleanQuery ? `?${cleanQuery}` : '') + window.location.hash;
            window.history.replaceState(null, '', cleanUrl);
        }

        document.getElementById('host-id').addEventListener('change', event => {
            if (pinFromUrl) return;
            const remembered = readRememberedControlPin(event.target.value);
            if (remembered) document.getElementById('control-pin').value = remembered;
        });

        ['host-id', 'control-pin'].forEach(inputId => {
            document.getElementById(inputId).addEventListener('keydown', event => {
                if (event.key === 'Enter') connectToHost();
            });
        });

        if (id && initialPin) {
            setTimeout(connectToHost, 500);
        } else if (id) {
            setStatus('Inserisci il PIN controllo', 'var(--warning)');
        }
    </script>
</body>

</html>
