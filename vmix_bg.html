<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPBA vMix Background & Ticker</title>
    <!-- PeerJS CDN -->
    <script src="lib/peerjs.min.js"></script>
    <script>window.Peer || document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
    <script src="pm-client.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-color: #22d3ee;
            --text-color: #f1f5f9;
            --font-main: 'Oswald', sans-serif;
            --font-nums: 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            /* vMix overlay */
            overflow: hidden;
            font-family: var(--font-main);
            width: 1920px;
            height: 1080px;
            position: relative;
        }

        /* BACKGROUND IMAGE OR VIDEO LAYER */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: transparent;
        }

        /* CUTOUTS PER LE TELECAMERE DI VMIX (Trasparenza) 
           Così il fondo appare sopra i video se vMix mette i video dietro, 
           oppure se vMix mette i video sopra, questi "buchi" non servono strettamente. 
           E' meglio usare questo come VERO SFONDO in vMix, posto sul LAYER 1.
        */

        /* LOWER THIRD TICKER BAR */
        #ticker-bar {
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
            border-top: 3px solid var(--accent-color);
            z-index: 10;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        #ticker-label {
            background-color: var(--accent-color);
            color: var(--bg-dark);
            height: 100%;
            padding: 0 30px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
            clip-path: polygon(0 0, 90% 0, 100% 100%, 0% 100%);
            flex-shrink: 0;
        }

        #ticker-content-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #ticker-text {
            position: absolute;
            white-space: nowrap;
            color: var(--text-color);
            font-size: 26px;
            line-height: 60px;
            font-family: var(--font-nums);
            /* Animazione da DESTRA verso SINISTRA */
            animation: scroll-left 35s linear infinite;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(1920px);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* TEAM STATS OVERLAY */
        .team-stats {
            position: absolute;
            bottom: 70px;
            /* Sopra al ticker */
            width: 320px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--text-color);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: none;
            /* Nascosto di default, mostrato da JS se c'è un match */
            flex-direction: column;
        }

        #team-a-stats {
            left: 30px;
            border-left: 5px solid var(--accent-color);
        }

        #team-b-stats {
            right: 30px;
            /* Spostato a destra visto che non c'è più lo sponsor */
            border-right: 5px solid #fbbf24;
            /* Uso colore ambra per contrastare */
        }

        .ts-title {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ts-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-family: var(--font-nums);
            margin: 2px 0;
            color: #94a3b8;
        }

        .ts-row span:last-child {
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }

        .val-green {
            color: #4ade80 !important;
        }

        .val-red {
            color: #f87171 !important;
        }
    </style>
</head>

<body>

    <!-- LAYER BACKGROUND -->
    <div id="bg-layer"></div>

    <!-- STATS TEAM A -->
    <div id="team-a-stats" class="team-stats">
        <div class="ts-title" id="ts-name-a">TEAM A</div>
        <div class="ts-row"><span>Giocate (P):</span> <span id="ts-p-a">0</span></div>
        <div class="ts-row"><span>Vittorie (V):</span> <span id="ts-w-a" class="val-green">0</span></div>
        <div class="ts-row"><span>Sconfitte (S):</span> <span id="ts-l-a" class="val-red">0</span></div>
        <div class="ts-row"><span>Diff. Punti:</span> <span id="ts-diff-a">0</span></div>
    </div>

    <!-- STATS TEAM B -->
    <div id="team-b-stats" class="team-stats">
        <div class="ts-title" id="ts-name-b">TEAM B</div>
        <div class="ts-row"><span>Giocate (P):</span> <span id="ts-p-b">0</span></div>
        <div class="ts-row"><span>Vittorie (V):</span> <span id="ts-w-b" class="val-green">0</span></div>
        <div class="ts-row"><span>Sconfitte (S):</span> <span id="ts-l-b" class="val-red">0</span></div>
        <div class="ts-row"><span>Diff. Punti:</span> <span id="ts-diff-b">0</span></div>
    </div>

    <!-- TICKER INFORMATIVO -->
    <div id="ticker-bar">
        <div id="ticker-label">RESULTS</div>
        <div id="ticker-content-wrapper">
            <div id="ticker-text">
                BENVENUTI AL TORNEO! &nbsp;&nbsp;&bull;&nbsp;&nbsp; IN ATTESA DEL PROSSIMO MATCH...
            </div>
        </div>
    </div>


    <script>
        // Sfondo reso completamente trasparente come richiesto per vMix Overlay
        document.getElementById('bg-layer').style.background = 'transparent';

        // ---------------------------------------------------------
        // LOGICA CONNESSIONE ALLA REGIA PER AGGIORNARE IL TICKER E STATS
        // Il trasporto (retry, PING/PONG, fallback locale->cloud) è gestito da pm-client.js
        let conn = null;
        let currentData = {}; // Stato consolidato

        let matchId = PMClient.getUrlId();

        if (!matchId) {
            matchId = prompt("Inserisci il Match ID della Regia:", "1674");
        }

        if (matchId) {
            conn = PMClient.connect({
                id: matchId,
                staleBadge: true,
                onStatus: (msg) => console.log('[Ticker]', msg),
                onData: handleData
            });
        }

        function handleData(data) {
            if (!data) return;

            // Handle Ping
            if (data.type === 'PING' && conn) {
                conn.send({ type: 'PONG', ts: data.ts });
                return;
            }

            try {
                if (typeof data === 'string') {
                    data = JSON.parse(data);
                }
            } catch (e) {
                console.error("Error parsing data:", e);
                return;
            }

            // Unione intelligente dello stato: se arriva un FULL_SYNC o un blocco tournament, sovrascriviamo, altrimenti uniamo
            if (data.type === 'FULL_SYNC' || data.tournament || data.standingsData) {
                Object.assign(currentData, data);
            } else {
                // Pacchetto parziale (es. solo timer)
                Object.assign(currentData, data);
            }

            // --- 1. POPOLAMENTO STATISTICHE SQUADRA CORRENTE ---
            const statsBoxA = document.getElementById('team-a-stats');
            const statsBoxB = document.getElementById('team-b-stats');

            // Utilizziamo lo stato consolidato (currentData) invece del pacchetto parziale
            const standings = currentData.standingsData ? currentData.standingsData.standings : null;

            // Determiniamo il match corrente dallo stato consolidato
            let activeMatch = null;
            if (currentData.tournament && currentData.tournament.active && typeof currentData.tournament.currentIndex !== 'undefined' && currentData.tournament.matches) {
                activeMatch = currentData.tournament.matches[currentData.tournament.currentIndex];
            }

            if (activeMatch && activeMatch.teamA && activeMatch.teamB && standings) {
                const teamAInfo = standings.find(s => s.name === activeMatch.teamA) || { played: 0, wins: 0, losses: 0, rw: 0, rl: 0 };
                const teamBInfo = standings.find(s => s.name === activeMatch.teamB) || { played: 0, wins: 0, losses: 0, rw: 0, rl: 0 };

                // Aggiorna Team A
                document.getElementById('ts-name-a').innerText = activeMatch.teamA;
                document.getElementById('ts-p-a').innerText = teamAInfo.played || 0;
                document.getElementById('ts-w-a').innerText = teamAInfo.wins || 0;
                document.getElementById('ts-l-a').innerText = teamAInfo.losses || 0;
                let diffA = (teamAInfo.rw || 0) - (teamAInfo.rl || 0);
                document.getElementById('ts-diff-a').innerText = diffA > 0 ? '+' + diffA : diffA;
                document.getElementById('ts-diff-a').className = diffA > 0 ? 'val-green' : (diffA < 0 ? 'val-red' : '');

                // Aggiorna Team B
                document.getElementById('ts-name-b').innerText = activeMatch.teamB;
                document.getElementById('ts-p-b').innerText = teamBInfo.played || 0;
                document.getElementById('ts-w-b').innerText = teamBInfo.wins || 0;
                document.getElementById('ts-l-b').innerText = teamBInfo.losses || 0;
                let diffB = (teamBInfo.rw || 0) - (teamBInfo.rl || 0);
                document.getElementById('ts-diff-b').innerText = diffB > 0 ? '+' + diffB : diffB;
                document.getElementById('ts-diff-b').className = diffB > 0 ? 'val-green' : (diffB < 0 ? 'val-red' : '');

                statsBoxA.style.display = 'flex';
                statsBoxB.style.display = 'flex';
            } else {
                statsBoxA.style.display = 'none';
                statsBoxB.style.display = 'none';
            }

            // --- 2. LOGICA TICKER DINAMICO ---
            const tickerEl = document.getElementById('ticker-text');

            let nmString = "";
            let modeString = "";

            if (currentData.nextMatch) {
                const scA = currentData.nextMatch.scoreA || 0;
                const scB = currentData.nextMatch.scoreB || 0;
                nmString = `PROSSIMO MATCH: <span style="color:#e2e8f0">${currentData.nextMatch.teamA}</span> <span style="color:var(--accent-color)">[${scA} - ${scB}]</span> <span style="color:#e2e8f0">${currentData.nextMatch.teamB}</span>`;
            }

            if (currentData.mode === 'BREAK_MATCH' || currentData.mode === 'INTERVAL') {
                modeString = "PARTITA IN PAUSA - SIAMO QUASI PRONTI A RIPARTIRE! ";
            } else if (currentData.mode === 'MATCH_OVER') {
                modeString = "PARTITA CONCLUSA! RISULTATO IN AGGIORNAMENTO... ";
            }

            const SEP = ' &nbsp;&nbsp;&bull;&nbsp;&nbsp; ';

            let finalScrollText = "";
            if (modeString) finalScrollText += modeString + SEP;
            if (nmString) finalScrollText += nmString + SEP;

            // Scontri diretti (archivio storico ipba scaricato dalla Regia)
            if (currentData.h2h) {
                const hc = currentData.h2h.current;
                const hn = currentData.h2h.next;
                const stessaCoppia = hc && hn && hc.teamA === hn.teamA && hc.teamB === hn.teamB;
                const sc = h2hTicker(hc, 'MATCH IN CORSO');
                if (sc) finalScrollText += sc + SEP;
                const bn = bestiaNeraTicker(hc);
                if (bn) finalScrollText += bn + SEP;
                if (!stessaCoppia) {
                    const sn = h2hTicker(hn, 'PROSSIMO MATCH');
                    if (sn) finalScrollText += sn + SEP;
                    const bnn = bestiaNeraTicker(hn);
                    if (bnn) finalScrollText += bnn + SEP;
                }
            }

            // Forma recente delle squadre in campo (archivio + oggi)
            if (currentData.teamHistory && currentData.h2h && currentData.h2h.current) {
                [currentData.h2h.current.teamA, currentData.h2h.current.teamB].forEach(nome => {
                    const th = currentData.teamHistory[tkNorm(nome)];
                    const f = formaTicker(th);
                    if (f) finalScrollText += f + SEP;
                });
            }

            // Aggiungi Storico Partite Giocate (Risultati)
            // I punteggi veri stanno in standingsData.matchHistory: il clone "light" di
            // tournament.matches trasmesso dalla Regia contiene solo il flag finished.
            const sd = currentData.standingsData;
            if (sd && sd.matchHistory && sd.matchHistory.length > 0) {
                finalScrollText += "RISULTATI RECENTI: &nbsp;&nbsp;";
                // matchHistory arriva dal più recente: lo giriamo in ordine di gioco
                [...sd.matchHistory].reverse().forEach(m => {
                    finalScrollText += `<span style="color:#e2e8f0">${m.teamA}</span> <span style="color:var(--accent-color)">[${m.scoreA || 0} - ${m.scoreB || 0}]</span> <span style="color:#e2e8f0">${m.teamB}</span>` + SEP;
                });
            }

            // Statistiche curiose del torneo (calcolate dalla Regia in standingsData)
            finalScrollText += buildStatsTicker(sd, currentData.tournament);

            // Classifiche "di sempre" dall'archivio storico (albo d'oro, veterane)
            finalScrollText += archivioTicker(currentData.archivioTop);

            if (finalScrollText === "") finalScrollText = "BENVENUTI AL TORNEO! IN ATTESA DELL'INIZIO...";

            // Aggiorna il DOM solo se il testo è cambiato (i pacchetti arrivano a 5Hz)
            // e adatta la durata dell'animazione: velocità costante ~110 px/s
            // anche quando il testo si allunga con le statistiche.
            if (tickerEl.dataset.lastText !== finalScrollText) {
                tickerEl.dataset.lastText = finalScrollText;
                tickerEl.innerHTML = finalScrollText;
                tickerEl.style.animationDuration = Math.max(35, Math.round((1920 + tickerEl.scrollWidth) / 110)) + 's';
            }
        }

        // Formatta il bilancio scontri diretti (packet.h2h dalla Regia):
        // "⚔️ PRECEDENTI X vs Y: 5 sfide — 4 X, 1 Y (ultimo: 3-6 · Evento)"
        function h2hTicker(h, prefix) {
            if (!h) return '';
            const hi = (t) => `<span style="color:#e2e8f0">${t}</span>`;
            const acc = (t) => `<span style="color:var(--accent-color)">${t}</span>`;
            const lab = (emoji, t) => `<span style="color:#fbbf24;font-weight:bold">${emoji} ${t}:</span>`;

            if (!h.count) {
                return lab('🆕', (prefix ? prefix + ' — ' : '') + 'SFIDA INEDITA') + ' ' +
                    hi(h.teamA) + ' e ' + hi(h.teamB) + ' ' + acc('non si sono mai affrontate nelle ultime stagioni');
            }
            let s = lab('⚔️', (prefix ? prefix + ' — ' : '') + 'PRECEDENTI') + ' ' +
                hi(h.teamA) + ' vs ' + hi(h.teamB) + ': ' + acc(h.count + (h.count === 1 ? ' sfida' : ' sfide'));
            const bits = [];
            if (h.winsA) bits.push(acc(h.winsA) + ' ' + hi(h.teamA));
            if (h.winsB) bits.push(acc(h.winsB) + ' ' + hi(h.teamB));
            if (h.draws) bits.push(acc(h.draws) + ' ' + hi(h.draws === 1 ? 'pareggio' : 'pareggi'));
            if (bits.length) s += ' — ' + bits.join(', ');
            if (h.last) {
                s += ` <span style="color:#94a3b8">(ultimo: ${h.last.scoreA}-${h.last.scoreB}${h.last.event ? ' · ' + h.last.event : ''})</span>`;
            }
            return s;
        }

        // Stessa normalizzazione nomi usata dalla Regia (chiavi di packet.teamHistory)
        const tkNorm = (n) => (n || '').trim().toUpperCase().replace(/\s+/g, ' ');

        // "👑 BESTIA NERA": una delle due domina lo scontro diretto (≥70% su almeno 4 sfide)
        function bestiaNeraTicker(h) {
            if (!h || h.count < 4) return '';
            const wMax = Math.max(h.winsA, h.winsB);
            if (wMax / h.count < 0.7) return '';
            const boss = h.winsA > h.winsB ? h.teamA : h.teamB;
            const preda = h.winsA > h.winsB ? h.teamB : h.teamA;
            return `<span style="color:#fbbf24;font-weight:bold">👑 BESTIA NERA:</span> ` +
                `<span style="color:#e2e8f0">${boss}</span> ha battuto <span style="color:#e2e8f0">${preda}</span> ` +
                `<span style="color:var(--accent-color)">${wMax} volte su ${h.count}</span>`;
        }

        // "📈 FORMA": esiti delle ultime 5 partite giocate (tutti gli eventi + oggi)
        function formaTicker(th) {
            if (!th || !th.forma || !th.forma.length) return '';
            const chip = (e) => e === 'V' ? '<span style="color:#4ade80;font-weight:bold">V</span>'
                : (e === 'S' ? '<span style="color:#f87171;font-weight:bold">S</span>'
                    : '<span style="color:#94a3b8;font-weight:bold">P</span>');
            const vitt = th.forma.filter(e => e === 'V').length;
            return `<span style="color:#fbbf24;font-weight:bold">📈 FORMA ${th.name}:</span> ` +
                th.forma.map(chip).join('&thinsp;') +
                ` <span style="color:var(--accent-color)">(${vitt}/${th.forma.length} vinte, ${th.played} partite IPBA in totale)</span>`;
        }

        // "🏆 ALBO D'ORO" e "🎖️ VETERANA" dalle classifiche di sempre dell'archivio
        function archivioTicker(at) {
            const SEP = ' &nbsp;&nbsp;&bull;&nbsp;&nbsp; ';
            if (!at) return '';
            let s = '';
            if (at.alboOro && at.alboOro[0]) {
                const a = at.alboOro[0];
                s += `<span style="color:#fbbf24;font-weight:bold">🏆 ALBO D'ORO:</span> ` +
                    `<span style="color:#e2e8f0">${a.team}</span> <span style="color:var(--accent-color)">${a.count} eventi vinti</span>` +
                    ` <span style="color:#94a3b8">(record storico IPBA)</span>` + SEP;
            }
            if (at.veterane && at.veterane[0]) {
                const v = at.veterane[0];
                s += `<span style="color:#fbbf24;font-weight:bold">🎖️ VETERANA:</span> ` +
                    `<span style="color:#e2e8f0">${v.team}</span> <span style="color:var(--accent-color)">${v.count} partite IPBA giocate</span>` +
                    ` <span style="color:#94a3b8">(più di tutte)</span>` + SEP;
            }
            return s;
        }

        // Costruisce il segmento "STATISTICHE TORNEO" del ticker dai dati
        // già trasmessi dalla Regia (calculateTournamentStats → standingsData).
        function buildStatsTicker(sd, tour) {
            if (!sd || !sd.standings || !sd.standings.length) return '';
            const played = sd.standings.filter(s => (s.played || 0) > 0);
            if (!played.length) return '';

            const SEP = ' &nbsp;&nbsp;&bull;&nbsp;&nbsp; ';
            const hi = (t) => `<span style="color:#e2e8f0">${t}</span>`;
            const acc = (t) => `<span style="color:var(--accent-color)">${t}</span>`;
            const lab = (emoji, t) => `<span style="color:#fbbf24;font-weight:bold">${emoji} ${t}:</span>`;
            const secs = (v) => Math.round(v) + 's';
            const parts = [];

            // Podio classifica
            const top3 = sd.standings.slice(0, 3).filter(s => s.wins > 0 || s.played > 0);
            if (top3.length) {
                parts.push(lab('🏆', 'CLASSIFICA') + ' ' + top3.map((s, i) => acc((i + 1) + '.') + ' ' + hi(s.name)).join(' '));
            }

            // Capolista con numeri
            const top = sd.standings[0];
            if (top && top.wins > 0) {
                const diff = (top.rw || 0) - (top.rl || 0);
                parts.push(lab('🥇', 'CAPOLISTA') + ' ' + hi(top.name) + ' ' + acc(top.wins + 'V, diff ' + (diff > 0 ? '+' : '') + diff));
            }

            // Squadre ancora imbattute (oltre alla capolista)
            const unbeaten = played.filter(s => s.losses === 0 && s.wins > 0).map(s => s.name);
            if (unbeaten.length > 1) {
                parts.push(lab('💪', 'ANCORA IMBATTUTE') + ' ' + hi(unbeaten.join(', ')));
            }

            // Punto più veloce del torneo
            if (sd.records && sd.records[0]) {
                const r = sd.records[0];
                parts.push(lab('⚡', 'PUNTO PIÙ VELOCE') + ' ' + hi(r.team) + ' ' + acc(secs(r.duration)) + (r.match ? ' (' + r.match + ')' : ''));
            }

            // Squadra col punto medio più rapido
            if (sd.averageTimes && sd.averageTimes[0]) {
                const a = sd.averageTimes[0];
                parts.push(lab('🎯', 'PUNTO MEDIO PIÙ RAPIDO') + ' ' + hi(a.team) + ' ' + acc(secs(a.avg)));
            }

            // Punto più combattuto (il più lungo)
            if (sd.slowestRounds && sd.slowestRounds[0]) {
                const sl = sd.slowestRounds[0];
                parts.push(lab('🐌', 'PUNTO PIÙ COMBATTUTO') + ' ' + hi(sl.team) + ' ' + acc(secs(sl.duration)) + (sl.match ? ' (' + sl.match + ')' : ''));
            }

            // Re del mercy
            if (sd.mercyKillers && sd.mercyKillers[0]) {
                const mk = sd.mercyKillers[0];
                parts.push(lab('💀', 'RE DEL MERCY') + ' ' + hi(mk.team) + ' ' + acc(mk.count + ' mercy'));
            }

            // Penalità (o fair play se nessuna)
            if (sd.badBoys && sd.badBoys[0]) {
                const bb = sd.badBoys[0];
                parts.push(lab('🚨', 'PIÙ PENALIZZATA') + ' ' + hi(bb.team) + ' ' + acc(bb.count + (bb.count === 1 ? ' penalità' : ' penalità')));
            } else {
                parts.push(lab('🤝', 'FAIR PLAY') + ' ' + hi('nessuna penalità finora!'));
            }

            // Miglior attacco / miglior difesa
            const att = [...played].sort((a, b) => (b.rw || 0) - (a.rw || 0))[0];
            if (att && att.rw > 0) {
                parts.push(lab('🔥', 'MIGLIOR ATTACCO') + ' ' + hi(att.name) + ' ' + acc(att.rw + ' punti fatti'));
            }
            const def = [...played].sort((a, b) => ((a.rl || 0) - (b.rl || 0)) || ((b.played || 0) - (a.played || 0)))[0];
            if (def) {
                parts.push(lab('🛡️', 'MIGLIOR DIFESA') + ' ' + hi(def.name) + ' ' + acc(def.rl + ' punti subiti'));
            }

            // Timeout tecnici
            if (sd.techUsage && sd.techUsage.length) {
                const tech = [...sd.techUsage].sort((a, b) => (b.tech || 0) - (a.tech || 0))[0];
                if (tech && tech.tech > 0) {
                    parts.push(lab('🔧', 'TECH TIMEOUT') + ' ' + hi(tech.name) + ' ' + acc(tech.tech));
                }
            }

            // Numeri del torneo
            const totPoints = played.reduce((t, s) => t + (s.rw || 0), 0);
            let progress = '';
            if (tour && tour.matches && tour.matches.length) {
                const fin = tour.matches.filter(m => m.savedState && m.savedState.finished).length;
                progress = acc(fin + '/' + tour.matches.length + ' match') + ' — ';
            }
            parts.push(lab('📊', 'IL TORNEO') + ' ' + progress + acc(totPoints + ' punti totali segnati'));

            if (!parts.length) return '';
            return '<span style="color:#fbbf24;font-weight:bold;letter-spacing:1px">STATISTICHE TORNEO</span> &nbsp;&nbsp; ' + parts.join(SEP) + SEP;
        }

    </script>
</body>

</html>
