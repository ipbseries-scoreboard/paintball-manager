<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPBA vMix Background & Ticker</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-color: #22d3ee;
            --text-color: #f1f5f9;
            --font-main: 'Oswald', sans-serif;
            --font-nums: 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            /* vMix overlay */
            overflow: hidden;
            font-family: var(--font-main);
            width: 1920px;
            height: 1080px;
            position: relative;
        }

        /* BACKGROUND IMAGE OR VIDEO LAYER */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: transparent;
        }

        /* CUTOUTS PER LE TELECAMERE DI VMIX (Trasparenza) 
           Così il fondo appare sopra i video se vMix mette i video dietro, 
           oppure se vMix mette i video sopra, questi "buchi" non servono strettamente. 
           E' meglio usare questo come VERO SFONDO in vMix, posto sul LAYER 1.
        */

        /* LOWER THIRD TICKER BAR */
        #ticker-bar {
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
            border-top: 3px solid var(--accent-color);
            z-index: 10;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        #ticker-label {
            background-color: var(--accent-color);
            color: var(--bg-dark);
            height: 100%;
            padding: 0 30px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
            clip-path: polygon(0 0, 90% 0, 100% 100%, 0% 100%);
            flex-shrink: 0;
        }

        #ticker-content-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #ticker-text {
            position: absolute;
            white-space: nowrap;
            color: var(--text-color);
            font-size: 26px;
            line-height: 60px;
            font-family: var(--font-nums);
            /* Animazione da DESTRA verso SINISTRA */
            animation: scroll-left 15s linear infinite;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(1920px);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* TEAM STATS OVERLAY */
        .team-stats {
            position: absolute;
            bottom: 70px;
            /* Sopra al ticker */
            width: 320px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--text-color);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: none;
            /* Nascosto di default, mostrato da JS se c'è un match */
            flex-direction: column;
        }

        #team-a-stats {
            left: 30px;
            border-left: 5px solid var(--accent-color);
        }

        #team-b-stats {
            right: 30px;
            /* Spostato a destra visto che non c'è più lo sponsor */
            border-right: 5px solid #fbbf24;
            /* Uso colore ambra per contrastare */
        }

        .ts-title {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ts-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-family: var(--font-nums);
            margin: 2px 0;
            color: #94a3b8;
        }

        .ts-row span:last-child {
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }

        .val-green {
            color: #4ade80 !important;
        }

        .val-red {
            color: #f87171 !important;
        }
    </style>
</head>

<body>

    <!-- LAYER BACKGROUND -->
    <div id="bg-layer"></div>

    <!-- STATS TEAM A -->
    <div id="team-a-stats" class="team-stats">
        <div class="ts-title" id="ts-name-a">TEAM A</div>
        <div class="ts-row"><span>Giocate (P):</span> <span id="ts-p-a">0</span></div>
        <div class="ts-row"><span>Vittorie (V):</span> <span id="ts-w-a" class="val-green">0</span></div>
        <div class="ts-row"><span>Sconfitte (S):</span> <span id="ts-l-a" class="val-red">0</span></div>
        <div class="ts-row"><span>Diff. Punti:</span> <span id="ts-diff-a">0</span></div>
    </div>

    <!-- STATS TEAM B -->
    <div id="team-b-stats" class="team-stats">
        <div class="ts-title" id="ts-name-b">TEAM B</div>
        <div class="ts-row"><span>Giocate (P):</span> <span id="ts-p-b">0</span></div>
        <div class="ts-row"><span>Vittorie (V):</span> <span id="ts-w-b" class="val-green">0</span></div>
        <div class="ts-row"><span>Sconfitte (S):</span> <span id="ts-l-b" class="val-red">0</span></div>
        <div class="ts-row"><span>Diff. Punti:</span> <span id="ts-diff-b">0</span></div>
    </div>

    <!-- TICKER INFORMATIVO -->
    <div id="ticker-bar">
        <div id="ticker-label">NEWS</div>
        <div id="ticker-content-wrapper">
            <div id="ticker-text">
                BENVENUTI AL TORNEO! &nbsp;&nbsp;&bull;&nbsp;&nbsp; IN ATTESA DEL PROSSIMO MATCH...
            </div>
        </div>
    </div>


    <script>
        // Sfondo reso completamente trasparente come richiesto per vMix Overlay
        document.getElementById('bg-layer').style.background = 'transparent';

        // ---------------------------------------------------------
        // LOGICA CONNESSIONE ALLA REGIA PER AGGIORNARE IL TICKER E STATS
        // ---------------------------------------------------------
        const peer = new Peer();
        let conn = null;

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || urlParams.get('matchId');

        peer.on('open', (id) => {
            console.log('Ticker Peer ID:', id);
            if (matchId) {
                let hostId = matchId.startsWith('IPBA-') ? matchId : 'IPBA-' + matchId;
                connectToHost(hostId);
            }
        });

        function connectToHost(hostId) {
            conn = peer.connect(hostId);
            conn.on('open', () => {
                conn.send({ type: 'requestState' });
            });
            conn.on('data', handleData);
            conn.on('close', () => setTimeout(() => connectToHost(hostId), 3000));
            conn.on('error', () => setTimeout(() => connectToHost(hostId), 3000));
        }

        function handleData(data) {
            if (!data) return;

            // --- 1. POPOLAMENTO STATISTICHE SQUADRA CORRENTE ---
            const statsBoxA = document.getElementById('team-a-stats');
            const statsBoxB = document.getElementById('team-b-stats');

            let currentMatch = null;
            if (data.tournament && data.tournament.active && data.tournament.currentIndex >= 0 && data.tournament.matches) {
                currentMatch = data.tournament.matches[data.tournament.currentIndex];
            }

            if (currentMatch && currentMatch.teamA && currentMatch.teamB && data.standingsData && data.standingsData.standings) {
                const standings = data.standingsData.standings;
                const teamAInfo = standings.find(s => s.name === currentMatch.teamA) || { played: 0, wins: 0, losses: 0, rw: 0, rl: 0 };
                const teamBInfo = standings.find(s => s.name === currentMatch.teamB) || { played: 0, wins: 0, losses: 0, rw: 0, rl: 0 };

                // Aggiorna Team A
                document.getElementById('ts-name-a').innerText = currentMatch.teamA;
                document.getElementById('ts-p-a').innerText = teamAInfo.played;
                document.getElementById('ts-w-a').innerText = teamAInfo.wins;
                document.getElementById('ts-l-a').innerText = teamAInfo.losses;
                let diffA = (teamAInfo.rw || 0) - (teamAInfo.rl || 0);
                document.getElementById('ts-diff-a').innerText = diffA > 0 ? '+' + diffA : diffA;
                document.getElementById('ts-diff-a').className = diffA > 0 ? 'val-green' : (diffA < 0 ? 'val-red' : '');

                // Aggiorna Team B
                document.getElementById('ts-name-b').innerText = currentMatch.teamB;
                document.getElementById('ts-p-b').innerText = teamBInfo.played;
                document.getElementById('ts-w-b').innerText = teamBInfo.wins;
                document.getElementById('ts-l-b').innerText = teamBInfo.losses;
                let diffB = (teamBInfo.rw || 0) - (teamBInfo.rl || 0);
                document.getElementById('ts-diff-b').innerText = diffB > 0 ? '+' + diffB : diffB;
                document.getElementById('ts-diff-b').className = diffB > 0 ? 'val-green' : (diffB < 0 ? 'val-red' : '');

                statsBoxA.style.display = 'flex';
                statsBoxB.style.display = 'flex';
            } else {
                statsBoxA.style.display = 'none';
                statsBoxB.style.display = 'none';
            }

            // --- 2. LOGICA TICKER DINAMICO ---
            const tickerEl = document.getElementById('ticker-text');

            let nmString = "";
            let modeString = "";

            if (data.nextMatch) {
                nmString = `PROSSIMO MATCH: <span style="color:var(--accent-color)">${data.nextMatch.teamA} vs ${data.nextMatch.teamB}</span>`;
            }

            if (data.mode === 'BREAK_MATCH' || data.mode === 'INTERVAL') {
                modeString = "PARTITA IN PAUSA - SIAMO QUASI PRONTI A RIPARTIRE! ";
            } else if (data.mode === 'MATCH_OVER') {
                modeString = "PARTITA CONCLUSA! RISULTATO IN AGGIORNAMENTO... ";
            }

            let finalScrollText = "";
            if (modeString) finalScrollText += modeString + "  &nbsp;&nbsp;&bull;&nbsp;&nbsp;  ";
            if (nmString) finalScrollText += nmString + "  &nbsp;&nbsp;&bull;&nbsp;&nbsp;  ";

            // Aggiungi Storico Partite Giocate (Risultati)
            if (data.tournament && data.tournament.matches) {
                const pastMatches = data.tournament.matches.filter(m => m.savedState && m.savedState.finished);
                if (pastMatches.length > 0) {
                    finalScrollText += "RISULTATI RECENTI: &nbsp;&nbsp;";
                    // Prendiamo le ultime 10 giocate (le piu recenti in fondo)
                    const recentMatches = pastMatches.slice(-10);
                    recentMatches.forEach(m => {
                        let scoreA = m.savedState.scoreA || 0;
                        let scoreB = m.savedState.scoreB || 0;
                        finalScrollText += `<span style="color:#e2e8f0">${m.teamA}</span> <span style="color:var(--accent-color)">[${scoreA} - ${scoreB}]</span> <span style="color:#e2e8f0">${m.teamB}</span> &nbsp;&nbsp;&bull;&nbsp;&nbsp; `;
                    });
                } else {
                    finalScrollText += "NESSUN RISULTATO ANCORA REGISTRATO...";
                }
            } else {
                finalScrollText += "IN ATTESA DELL'INIZIO DEL TORNEO...";
            }

            tickerEl.innerHTML = finalScrollText;
        }

    </script>
</body>

</html>
