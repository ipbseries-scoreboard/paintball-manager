<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Setup Rose IPBA</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="roster-core.js?v=1"></script>
    <script src="roster-storage.js?v=1"></script>
    <style>
        :root{--bg:#07111f;--panel:#111d30;--panel2:#18263b;--line:#334155;--cyan:#22d3ee;--amber:#fbbf24;--red:#ef4444;--green:#22c55e;--text:#e5edf8;--muted:#91a2b8}
        *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
        .topbar{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);padding:16px 22px}.title-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.title{font:700 34px Oswald,sans-serif;letter-spacing:3px;color:var(--cyan)}
        .summary{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1727;color:var(--muted)}.pill b{color:#fff}.save-state{margin-left:auto;color:var(--amber);font-weight:700}
        .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #476078;border-radius:9px;padding:9px 13px;background:#1b2a40;color:#fff;font-weight:700}.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}.btn.primary{background:#0e7490;border-color:var(--cyan)}.btn.good{background:#14532d;border-color:var(--green)}.btn.warn{background:#78350f;border-color:var(--amber)}.btn.danger{background:#7f1d1d;border-color:var(--red)}.btn.small{font-size:12px;padding:6px 8px}
        .team-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 22px 0}.team-tab{min-height:94px;padding:13px 18px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:#fff;text-align:left}.team-tab.active{border-color:var(--cyan);box-shadow:0 0 22px rgba(34,211,238,.16)}.team-tab.missing{border-color:var(--red)}.team-tab strong{display:block;font:700 25px Oswald,sans-serif}.team-tab span{color:var(--muted)}
        .workspace{display:grid;grid-template-columns:minmax(620px,1.05fr) minmax(520px,.95fr);gap:16px;padding:16px 22px 35px}.editor,.preview-column{min-width:0}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;margin-bottom:14px}.panel h2,.panel h3{font-family:Oswald,sans-serif;letter-spacing:1px;margin:0 0 12px}.panel h2{color:var(--cyan)}.panel h3{color:var(--amber)}
        .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}.field input,.field select{width:100%;min-width:0;background:#091426;color:#fff;border:1px solid #41526a;border-radius:7px;padding:8px}.field input[type=color]{height:38px;padding:3px}.field input[type=checkbox]{width:auto}
        .quality-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quality-metric{background:#0a1526;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.quality-metric b{display:block;font:700 25px Oswald,sans-serif;color:var(--cyan)}.warnings{margin:10px 0 0;padding-left:19px;color:#fca5a5}.quality-ok{color:#86efac}
        .player-list{display:grid;gap:12px}.player-card{background:var(--panel2);border:1px solid #40526b;border-radius:14px;padding:12px;transition:border .2s,opacity .2s}.player-card.dragging{opacity:.45}.player-card.drop-target{border-color:var(--amber)}.player-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.drag{font-size:24px;color:var(--muted);cursor:grab}.player-title{font:700 20px Oswald,sans-serif;flex:1}.origin{padding:4px 7px;border-radius:6px;background:#0c4a6e;color:#bae6fd;font-size:11px}.origin.manual{background:#713f12;color:#fde68a}
        .player-main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:13px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:7px}.photo-box{min-width:0}.photo-label{text-align:center;color:var(--muted);font-size:10px;margin-bottom:4px}.checker{height:170px;border:1px solid #4b5e77;border-radius:9px;overflow:hidden;position:relative;background-color:#d8dee8;background-image:linear-gradient(45deg,#b8c2d0 25%,transparent 25%),linear-gradient(-45deg,#b8c2d0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b8c2d0 75%),linear-gradient(-45deg,transparent 75%,#b8c2d0 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.checker img{width:100%;height:100%;object-fit:contain}.checker.current{height:170px}.checker.current img{position:absolute;left:5%;top:0;width:90%;height:118%;object-fit:cover;object-position:center top;transform-origin:center top}.photo-missing{display:grid;place-items:center;height:100%;color:#64748b;font:700 28px Oswald,sans-serif}.photo-state{font-size:10px;text-align:center;margin-top:4px}.photo-state.good{color:#86efac}.photo-state.bad{color:#fca5a5}
        .player-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.player-fields .field{font-size:11px}.player-fields .field.name{grid-column:span 2}.adjustments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid #334155}.range-line{display:grid;grid-template-columns:85px minmax(0,1fr) 42px;align-items:center;gap:5px;font-size:10px;color:var(--muted)}.range-line input{width:100%}.range-line output{text-align:right;color:#fff}.player-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.player-actions input[type=file]{display:none}
        .preview-column{position:relative}.preview-sticky{position:sticky;top:145px}.preview-frame{aspect-ratio:16/9;width:100%;background:#030712;border:1px solid var(--cyan);border-radius:15px;overflow:hidden;box-shadow:0 0 25px rgba(34,211,238,.14)}.preview-frame iframe{width:1920px;height:1080px;border:0;transform-origin:top left;pointer-events:none}.preview-controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.storage-note{margin-top:10px;border-left:4px solid var(--amber);background:#1c1917;padding:10px;color:#fcd34d;font-size:13px}
        dialog{border:1px solid var(--cyan);border-radius:16px;background:var(--panel);color:#fff;min-width:520px;max-width:90vw}dialog::backdrop{background:rgba(0,0,0,.75)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;z-index:50;max-width:520px;padding:13px 18px;border-radius:10px;background:#0f766e;color:#fff;box-shadow:0 12px 35px #000;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{background:#991b1b}
        @media(max-width:1250px){.workspace{grid-template-columns:1fr}.preview-sticky{position:relative;top:auto}.player-main{grid-template-columns:190px 1fr}}@media(max-width:720px){.team-switch{grid-template-columns:1fr}.workspace{padding:10px;display:block}.form-grid,.player-fields{grid-template-columns:1fr 1fr}.player-main{grid-template-columns:1fr}.photos{max-width:330px}.topbar{position:relative}.save-state{margin-left:0}}
    </style>
</head>
<body>
    <header class="topbar">
        <div class="title-row"><div class="title">SETUP ROSE</div><div class="summary" id="summary"></div><div class="save-state" id="save-state">CARICAMENTO...</div></div>
        <div class="toolbar">
            <button class="btn primary" data-action="import-a">IMPORTA SQUADRA A</button><button class="btn primary" data-action="import-b">IMPORTA SQUADRA B</button><button class="btn primary" data-action="import-both">AGGIORNA ENTRAMBE DA IPBA</button>
            <button class="btn good" data-action="save">SALVA TUTTO</button><button class="btn" data-action="preview">ANTEPRIMA DOPPIA ROSA</button><button class="btn" data-action="open-transparent">APRI ROSTER TRASPARENTE</button>
            <button class="btn" data-action="export">ESPORTA CONFIGURAZIONI</button><button class="btn" data-action="import-file">IMPORTA CONFIGURAZIONI</button><input type="file" id="import-file" accept="application/json,.json" hidden>
            <button class="btn danger" data-action="restore">RIPRISTINA DATI ORIGINALI</button>
        </div>
    </header>
    <section class="team-switch" id="team-switch"></section>
    <main class="workspace">
        <section class="editor"><div id="team-editor"></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>GIOCATORI</h2><button class="btn good" data-action="add-player">+ AGGIUNGI GIOCATORE</button></div><div class="player-list" id="player-list"></div></div></section>
        <aside class="preview-column"><div class="preview-sticky"><div class="panel"><h2>ANTEPRIMA COMPLETA 1920×1080</h2><div class="preview-frame" id="preview-frame"><iframe id="preview"></iframe></div><div class="preview-controls">
            <button class="btn small" data-cmd="REPLAY_ANIMATION">RIPRODUCI</button><button class="btn small" data-cmd="HIDE_ROSTER">FERMA</button><button class="btn small" data-cmd="REFRESH_ROSTER">RICARICA DATI</button><button class="btn small" data-cmd="SHOW_TEAM_A">SOLO A</button><button class="btn small" data-cmd="SHOW_TEAM_B">SOLO B</button><button class="btn small" data-cmd="SHOW_BOTH_TEAMS">ENTRAMBE</button>
            <button class="btn small" data-bg="dark">SCURO</button><button class="btn small" data-bg="light">CHIARO</button><button class="btn small" data-bg="field">CAMPO</button><button class="btn small" data-bg="grid">TRASPARENZA</button><button class="btn small" data-bg="transparent">TRASPARENTE</button>
        </div><div class="storage-note" id="storage-note">Il salvataggio server viene verificato durante il caricamento.</div></div><div class="panel" id="quality"></div></div></aside>
    </main>
    <dialog id="manual-dialog"><form method="dialog" id="manual-form"><h2>AGGIUNGI GIOCATORE</h2><div class="form-grid"><label class="field">Squadra<select name="side"><option value="A">SQUADRA A</option><option value="B">SQUADRA B</option></select></label><label class="field">Nome<input name="firstName" required maxlength="50"></label><label class="field">Cognome<input name="lastName" required maxlength="50"></label><label class="field">Nome visualizzato<input name="displayName" maxlength="100"></label><label class="field">Numero<input name="number" maxlength="12"></label><label class="field">Ruolo<input name="role" maxlength="40"></label><label class="field">Fila<select name="row"><option>AUTO</option><option>POSTERIORE</option><option>CENTRALE</option><option>ANTERIORE</option></select></label><label class="field">Posizione<input name="position" type="number" min="1" max="99" value="1"></label></div><div class="modal-actions"><button class="btn" value="cancel">ANNULLA</button><button class="btn good" value="default" id="manual-save">AGGIUNGI</button></div></form></dialog>
    <div class="toast" id="toast"></div>
    <script>
        'use strict';
        const Core=IPBARosterCore,Storage=IPBARosterStorage,params=new URLSearchParams(location.search);
        const ids={A:Core.safeTeamId(params.get('idA')||params.get('id')),B:Core.safeTeamId(params.get('idB'))};
        const state={A:null,B:null,active:'A',dirty:false,storage:{A:'',B:''},lastSaved:0,dragKey:''};
        const $=id=>document.getElementById(id); let toastTimer=null,previewTimer=null;

        function toast(message,error){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',5000)}
        function setStatus(text){$('save-state').textContent=text}
        function markDirty(){state.dirty=true;setStatus('MODIFICHE NON SALVATE');clearTimeout(previewTimer);previewTimer=setTimeout(()=>sendPreview('REFRESH_ROSTER'),450)}
        function activeRoster(){return state[state.active]}
        function rosterUrl(preview){const a=state.A&&state.A.team.id||ids.A,b=state.B&&state.B.team.id||ids.B;const q=new URLSearchParams();if(a&&b){q.set('idA',a);q.set('idB',b);q.set('mode','dual')}else if(a||b)q.set('id',a||b);if(preview)q.set('preview','1');q.set('autoplay','1');return 'roster-lineup.html?'+q.toString()}
        function refreshPreview(){const iframe=$('preview'),url=rosterUrl(true);if(iframe.getAttribute('src')!==url)iframe.src=url;resizePreview()}
        function resizePreview(){const frame=$('preview-frame'),iframe=$('preview');if(!frame||!iframe)return;const scale=frame.clientWidth/1920;iframe.style.transform='scale('+scale+')';frame.style.height=(1080*scale)+'px'}
        addEventListener('resize',resizePreview);
        function sendPreview(type,value){const frame=$('preview');try{frame.contentWindow.postMessage(value?{type,value}: {type},location.origin)}catch(error){}}

        async function loadSide(side){const id=ids[side];if(!id){state[side]=null;return}try{const result=await Storage.loadTeam(id);state[side]=result.roster;state.storage[side]=result.storage;if(result.warning)toast(result.warning,true)}catch(error){state[side]=Core.defaultTeam(id);state.storage[side]='NUOVA';toast(error.message,true)}}
        async function init(){await Promise.all([loadSide('A'),loadSide('B')]);if(!state.A&&state.B)state.active='B';renderAll();refreshPreview();setStatus('PRONTO');}

        function renderAll(){renderSummary();renderSwitch();renderTeamEditor();renderPlayers();renderQuality();renderStorageNote()}
        function renderSummary(){const a=state.A?state.A.players.length:0,b=state.B?state.B.players.length:0;const root=$('summary');root.replaceChildren();[['Squadra A',state.A&&state.A.team.name||'—'],['Squadra B',state.B&&state.B.team.name||'—'],['Giocatori A',a],['Giocatori B',b],['Totale',a+b+' / 24'],['Ultimo aggiornamento',state.lastSaved?new Date(state.lastSaved).toLocaleTimeString('it-IT'):'—']].forEach(item=>{const el=document.createElement('div');el.className='pill';const bEl=document.createElement('b');bEl.textContent=item[0]+': ';el.append(bEl,document.createTextNode(item[1]));root.appendChild(el)})}
        function renderSwitch(){const root=$('team-switch');root.replaceChildren();['A','B'].forEach(side=>{const roster=state[side],button=document.createElement('button');button.className='team-tab'+(state.active===side?' active':'')+(!ids[side]?' missing':'');const strong=document.createElement('strong');strong.textContent='SQUADRA '+side+' — '+(roster?roster.team.name:'ID NON CONFIGURATO');const span=document.createElement('span');span.textContent=roster?(roster.players.length+' giocatori · '+state.storage[side]):'Aggiungi id'+side+' all’URL';button.append(strong,span);button.addEventListener('click',()=>{if(roster){state.active=side;renderAll()}});root.appendChild(button)})}

        function field(label,value,type,onChange,options){const wrap=document.createElement('label');wrap.className='field'+((options&&options.wide)?' wide':'');wrap.append(document.createTextNode(label));let input;if(type==='select'){input=document.createElement('select');(options.values||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;input.appendChild(o)})}else{input=document.createElement('input');input.type=type||'text';if(options&&options.min!=null)input.min=options.min;if(options&&options.max!=null)input.max=options.max;if(options&&options.step!=null)input.step=options.step}if(type==='checkbox')input.checked=!!value;else input.value=value==null?'':value;input.addEventListener(type==='range'?'input':'change',()=>{onChange(type==='checkbox'?input.checked:input.value,input);markDirty()});wrap.appendChild(input);return wrap}
        function renderTeamEditor(){const root=$('team-editor');root.replaceChildren();const roster=activeRoster();if(!roster){const box=document.createElement('div');box.className='panel';box.textContent='Nessuna squadra disponibile.';root.appendChild(box);return}const box=document.createElement('div');box.className='panel';const h=document.createElement('h2');h.textContent='SQUADRA '+state.active+' — DATI E TEMA';const grid=document.createElement('div');grid.className='form-grid';const t=roster.team;
            grid.append(field('Nome squadra',t.name,'text',v=>t.name=Core.cleanText(v,100),{wide:true}),field('Codice società',t.companyCode,'text',v=>t.companyCode=Core.cleanText(v,50)),field('Denominazione società',t.companyName,'text',v=>t.companyName=Core.cleanText(v,180),{wide:true}),field('Titolo grafica',t.title,'text',v=>t.title=Core.cleanText(v,50)),field('Logo personalizzato (URL)',t.customLogoUrl,'text',v=>t.customLogoUrl=Core.safeHttpUrl(v),{wide:true}),field('Colore principale',t.primaryColor,'color',v=>t.primaryColor=v),field('Colore secondario',t.secondaryColor,'color',v=>t.secondaryColor=v));box.append(h,grid);root.appendChild(box)}

        function imageElement(url){if(!url){const ph=document.createElement('div');ph.className='photo-missing';ph.textContent='FOTO ASSENTE';return ph}const img=document.createElement('img');img.src=url;img.alt='';img.loading='lazy';return img}
        async function renderCurrentPhoto(container,player){const url=await Storage.resolvePlayerImage(player);container.replaceChildren(imageElement(url));const img=container.querySelector('img');if(img){img.style.transform='translate('+player.image.offsetX+'%,'+player.image.offsetY+'%) scale('+(player.image.flipX?-player.image.scale:player.image.scale)+','+player.image.scale+')';img.style.top=(-player.image.cropTop)+'%';img.style.height=(112+player.image.cropBottom)+'%'}}

        function renderPlayers(){const root=$('player-list');root.replaceChildren();const roster=activeRoster();if(!roster)return;roster.players.sort((a,b)=>a.customData.order-b.customData.order).forEach((player,index)=>root.appendChild(playerCard(player,index)))}
        function playerCard(player,index){const card=document.createElement('article');card.className='player-card';card.draggable=true;card.dataset.key=player.playerKey;card.addEventListener('dragstart',()=>{state.dragKey=player.playerKey;card.classList.add('dragging')});card.addEventListener('dragend',()=>{state.dragKey='';card.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))});card.addEventListener('dragover',e=>{e.preventDefault();if(state.dragKey&&state.dragKey!==player.playerKey)card.classList.add('drop-target')});card.addEventListener('dragleave',()=>card.classList.remove('drop-target'));card.addEventListener('drop',e=>{e.preventDefault();reorderPlayer(state.dragKey,player.playerKey)});
            const head=document.createElement('div');head.className='player-head';const drag=document.createElement('span');drag.className='drag';drag.textContent='⋮⋮';const title=document.createElement('div');title.className='player-title';title.textContent='GIOCATORE '+(Core.displayData(player).number?'#'+Core.displayData(player).number:'')+' — '+Core.displayData(player).name;const origin=document.createElement('span');origin.className='origin'+(player.source.type==='MANUAL'?' manual':'');origin.textContent='ORIGINE: '+(player.source.type==='MANUAL'?'MANUALE':'IPBA');head.append(drag,title,origin);
            const originalInfo=document.createElement('div');originalInfo.style.cssText='color:var(--muted);font-size:11px;margin:-5px 0 10px 34px';originalInfo.textContent='DATI ORIGINALI IPBA: '+(player.originalData.fullName||'—')+' · #'+(player.originalData.number||'—')+' · '+(player.originalData.role||'RUOLO MANCANTE')+(player.originalData.age?' · '+player.originalData.age+' anni':'');
            const main=document.createElement('div');main.className='player-main';const photos=document.createElement('div');photos.className='photos';const originalBox=document.createElement('div');originalBox.className='photo-box';const ol=document.createElement('div');ol.className='photo-label';ol.textContent='ORIGINALE';const oc=document.createElement('div');oc.className='checker';oc.appendChild(imageElement(player.source.originalPhotoUrl));originalBox.append(ol,oc);const currentBox=document.createElement('div');currentBox.className='photo-box';const cl=document.createElement('div');cl.className='photo-label';cl.textContent='FOTO UTILIZZATA — MEZZO BUSTO';const cc=document.createElement('div');cc.className='checker current';cc.style.height=player.image.bustHeight*2.25+'px';renderCurrentPhoto(cc,player);const ps=document.createElement('div');ps.className='photo-state '+(player.image.hasTransparency?'good':'bad');ps.textContent=player.image.selectedSource==='CUSTOM'?(player.image.hasTransparency?'TRASPARENZA RILEVATA: SÌ':'TRASPARENZA RILEVATA: NO — SOSTITUIRE SE SERVE LO SCONTORNO'):'FOTO ORIGINALE — TRASPARENZA NON VERIFICATA';currentBox.append(cl,cc,ps);photos.append(originalBox,currentBox);
            const controls=document.createElement('div'),fields=document.createElement('div');fields.className='player-fields';const d=player.customData;
            fields.append(field('Nome personalizzato',d.firstName,'text',v=>d.firstName=Core.cleanText(v,50)),field('Cognome personalizzato',d.lastName,'text',v=>d.lastName=Core.cleanText(v,50)),field('Nome visualizzato',d.displayName,'text',v=>d.displayName=Core.cleanText(v,100),{wide:true}),field('Numero (orig. '+(player.originalData.number||'—')+')',d.number,'text',v=>d.number=Core.cleanText(v,12)),field('Ruolo (orig. '+(player.originalData.role||'—')+')',d.role,'text',v=>d.role=Core.cleanText(v,40).toUpperCase()),field('Soprannome',d.nickname,'text',v=>d.nickname=Core.cleanText(v,60)),field('Ordine',d.order,'number',v=>d.order=Math.max(1,parseInt(v,10)||1),{min:1,max:999}),field('Fila',d.row,'select',v=>d.row=v,{values:Core.ROWS}),field('Posizione',d.rowPosition,'number',v=>d.rowPosition=Math.max(1,parseInt(v,10)||1),{min:1,max:99}),field('Visibile',d.visible,'checkbox',v=>d.visible=v));controls.appendChild(fields);
            const adjustments=document.createElement('div');adjustments.className='adjustments';[['Scala','scale',.5,3,.05],['Posizione X','offsetX',-100,100,1],['Posizione Y','offsetY',-100,100,1],['Altezza mezzo busto','bustHeight',45,100,1],['Crop superiore','cropTop',0,45,1],['Crop inferiore','cropBottom',0,55,1]].forEach(spec=>adjustments.appendChild(rangeField(spec[0],player,spec[1],spec[2],spec[3],spec[4],cc)));controls.appendChild(adjustments);
            const toggles=document.createElement('div');toggles.className='player-fields';toggles.append(field('Ribalta',player.image.flipX,'checkbox',v=>{player.image.flipX=v;renderCurrentPhoto(cc,player)}),field('Ombra',player.image.shadow,'checkbox',v=>player.image.shadow=v),field('Glow',player.image.glow,'checkbox',v=>player.image.glow=v));controls.appendChild(toggles);main.append(photos,controls);
            const actions=document.createElement('div');actions.className='player-actions';const upload=document.createElement('input');upload.type='file';upload.accept='image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg';upload.id='photo-'+index;upload.addEventListener('change',()=>{if(upload.files[0])handlePhoto(player,upload.files[0])});const label=document.createElement('label');label.className='btn small good';label.htmlFor=upload.id;label.textContent='CARICA FOTO SCONTORNATA';actions.append(upload,label,actionButton('USA ORIGINALE',()=>{player.image.selectedSource='ORIGINAL';markDirty();renderPlayers()}),actionButton('USA PERSONALIZZATA',()=>{if(player.image.customImageUrl||player.image.customImageStorageKey){player.image.selectedSource='CUSTOM';markDirty();renderPlayers()}}),actionButton('RIMUOVI FOTO',()=>removePhoto(player),true),actionButton('RIPRISTINA REGOLAZIONI',()=>{Object.assign(player.image,{scale:1,offsetX:0,offsetY:0,bustHeight:72,cropTop:0,cropBottom:12,flipX:false,shadow:true,glow:true});markDirty();renderPlayers()}));if(player.source.type==='MANUAL')actions.append(actionButton('ELIMINA GIOCATORE',()=>{if(confirm('Eliminare il giocatore manuale?')){activeRoster().players=activeRoster().players.filter(p=>p.playerKey!==player.playerKey);markDirty();renderAll()}},true));card.append(head,originalInfo,main,actions);return card}
        function actionButton(text,handler,danger){const b=document.createElement('button');b.className='btn small'+(danger?' danger':'');b.textContent=text;b.type='button';b.addEventListener('click',handler);return b}
        function rangeField(label,player,key,min,max,step,preview){const line=document.createElement('label');line.className='range-line';const span=document.createElement('span');span.textContent=label;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=player.image[key];const output=document.createElement('output');output.textContent=input.value;input.addEventListener('input',()=>{player.image[key]=Number(input.value);output.textContent=input.value;if(key==='bustHeight')preview.style.height=(player.image.bustHeight*2.25)+'px';markDirty();renderCurrentPhoto(preview,player)});line.append(span,input,output);return line}
        function reorderPlayer(sourceKey,targetKey){const roster=activeRoster(),from=roster.players.findIndex(p=>p.playerKey===sourceKey),to=roster.players.findIndex(p=>p.playerKey===targetKey);if(from<0||to<0)return;const [moved]=roster.players.splice(from,1);roster.players.splice(to,0,moved);roster.players.forEach((p,i)=>p.customData.order=i+1);state.dragKey='';markDirty();renderPlayers();Storage.notify('ROSTER_ORDER_UPDATED',roster.team.id,Date.now())}

        function renderQuality(){const root=$('quality');root.replaceChildren();const h=document.createElement('h2');h.textContent='CONTROLLO DOPPIA ROSA';root.appendChild(h);let total=0;['A','B'].forEach(side=>{const roster=state[side];if(!roster)return;const q=Core.qualityReport(roster);total+=q.visible;const h3=document.createElement('h3');h3.textContent='SQUADRA '+side+' — '+roster.team.name;root.appendChild(h3);const grid=document.createElement('div');grid.className='quality-grid';[['Visibili',q.visible],['Trasparenti',q.transparent],['Originali',q.original],['Mancanti',q.missing]].forEach(m=>{const box=document.createElement('div');box.className='quality-metric';const b=document.createElement('b');b.textContent=m[1];box.append(b,document.createTextNode(m[0]));grid.appendChild(box)});root.appendChild(grid);if(q.warnings.length){const ul=document.createElement('ul');ul.className='warnings';q.warnings.forEach(w=>{const li=document.createElement('li');li.textContent=w;ul.appendChild(li)});root.appendChild(ul)}else{const ok=document.createElement('p');ok.className='quality-ok';ok.textContent='✓ Nessuna anomalia rilevata';root.appendChild(ok)}});const totalEl=document.createElement('h3');totalEl.textContent='TOTALE: '+total+' / 24 giocatori visibili';if(total>24)totalEl.style.color='var(--red)';root.appendChild(totalEl)}
        function renderStorageNote(){const values=['A','B'].filter(s=>state[s]).map(s=>'Squadra '+s+': '+state.storage[s]),states=['A','B'].map(s=>state.storage[s]);let note=' — Configurazioni condivise dal server locale.';if(states.includes('STATICO'))note=' — File pubblicati condivisi in sola lettura: usa il server locale, esporta e ripubblica per applicare modifiche a tutti.';else if(states.some(value=>value==='LOCALE'||value==='NUOVA'))note=' — I dati locali non sono condivisi con altri computer. Avvia server.js per la condivisione.';$('storage-note').textContent=values.join(' · ')+note}

        async function importSide(side){if(!ids[side]){toast('ID squadra '+side+' mancante',true);return}setStatus('IMPORTAZIONE SQUADRA '+side+'...');try{const result=await Storage.importTeam(ids[side],state[side]);state[side]=result.roster;state.storage[side]=result.storage;if(result.warning)toast(result.warning,true);state.dirty=false;renderAll();refreshPreview();setStatus('IMPORTAZIONE COMPLETATA')}catch(error){toast(error.message,true);setStatus('ERRORE IMPORTAZIONE')}}
        async function saveAll(){setStatus('SALVATAGGIO...');const sides=['A','B'].filter(s=>state[s]);let warnings=[];for(const side of sides){const result=await Storage.saveTeam(state[side]);state[side]=result.roster;state.storage[side]=result.storage;if(result.warning)warnings.push(result.warning)}state.dirty=false;state.lastSaved=Date.now();renderAll();sendPreview('REFRESH_ROSTER');setStatus('SALVATO '+new Date().toLocaleTimeString('it-IT'));if(warnings.length)toast(warnings.join(' '),true);else toast('Configurazioni salvate')}

        async function loadImage(file){const url=URL.createObjectURL(file);try{return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Immagine non leggibile'));img.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
        async function prepareImage(file){const allowed=['image/png','image/webp','image/jpeg'];const ext=(file.name.split('.').pop()||'').toLowerCase();if(!allowed.includes(file.type)||!['png','webp','jpg','jpeg'].includes(ext))throw new Error('Formato non valido: usa PNG, WebP o JPG');if(file.size>10*1024*1024)throw new Error('Foto oltre il limite di 10 MB');const img=await loadImage(file);if(img.naturalWidth>6000||img.naturalHeight>6000||img.naturalWidth*img.naturalHeight>25000000)throw new Error('Dimensioni foto eccessive');const max=4096,scale=Math.min(1,max/img.naturalWidth,max/img.naturalHeight),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height),data=pixels.data;let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1,hasTransparency=false;for(let y=0;y<canvas.height;y++){for(let x=0;x<canvas.width;x++){const a=data[(y*canvas.width+x)*4+3];if(a<250)hasTransparency=true;if(a>5){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}}let out=canvas;if(hasTransparency&&maxX>=minX){out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;out.getContext('2d').drawImage(canvas,minX,minY,out.width,out.height,0,0,out.width,out.height)}const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png',.95));if(!blob)throw new Error('Elaborazione foto non riuscita');return{blob,width:out.width,height:out.height,hasTransparency,warning:!hasTransparency?'La foto non contiene trasparenza. È utilizzabile, ma per lo scontorno carica un PNG/WebP trasparente.':''}}
        async function handlePhoto(player,file){setStatus('ELABORAZIONE FOTO...');try{const prepared=await prepareImage(file),result=await Storage.uploadPlayerImage(activeRoster().team.id,player.playerKey,prepared.blob,prepared);player.image.customImageUrl=result.url;player.image.customImageStorageKey=result.storageKey;player.image.selectedSource='CUSTOM';player.image.hasTransparency=prepared.hasTransparency;player.image.width=prepared.width;player.image.height=prepared.height;markDirty();renderPlayers();renderQuality();setStatus('FOTO PRONTA — SALVA TUTTO');if(prepared.warning||result.warning)toast([prepared.warning,result.warning].filter(Boolean).join(' '),true);else toast('Foto scontornata caricata e rifilata')}catch(error){toast(error.message,true);setStatus('ERRORE FOTO')}}
        async function removePhoto(player){if(!confirm('Rimuovere la foto personalizzata e tornare all’originale IPBA?'))return;await Storage.removePlayerImage(activeRoster().team.id,player.playerKey,player.image.customImageStorageKey);Object.assign(player.image,{selectedSource:'ORIGINAL',customImageUrl:'',customImageStorageKey:'',hasTransparency:false});markDirty();renderPlayers();renderQuality()}

        function addManual(){const dialog=$('manual-dialog');$('manual-form').reset();$('manual-form').elements.side.value=state.active;dialog.showModal()}
        $('manual-form').addEventListener('submit',event=>{event.preventDefault();if(event.submitter&&event.submitter.value==='cancel'){$('manual-dialog').close();return}const data=new FormData(event.currentTarget),side=data.get('side'),roster=state[side];if(!roster){toast('Squadra non disponibile',true);return}const full=Core.cleanText(data.get('lastName')+' '+data.get('firstName'),100),number=Core.cleanText(data.get('number'),12);let player=Core.defaultPlayer(roster.team.id,{source:{type:'MANUAL'},originalData:{fullName:full,number,role:Core.cleanText(data.get('role'),40)},customData:{displayName:Core.cleanText(data.get('displayName'),100),number,role:Core.cleanText(data.get('role'),40),visible:true,order:roster.players.length+1,row:data.get('row'),rowPosition:parseInt(data.get('position'),10)||1}},roster.players.length);player.playerKey=Core.safePlayerKey(player.playerKey+'-'+Date.now().toString(36));roster.players.push(player);state.active=side;$('manual-dialog').close();markDirty();renderAll()});

        async function exportAll(){setStatus('PREPARAZIONE ESPORTAZIONE...');const payload={format:'IPBA_ROSTER_EXPORT',version:1,exportedAt:Date.now(),teams:{},embeddedImages:{}};for(const side of ['A','B']){const roster=state[side];if(!roster)continue;payload.teams[roster.team.id]=Core.normalizeRoster(roster);for(const player of roster.players){if(player.image.selectedSource!=='CUSTOM')continue;const url=await Storage.resolvePlayerImage(player);if(!url)continue;try{const blob=await fetch(url).then(r=>r.blob());payload.embeddedImages[roster.team.id+'|'+player.playerKey]=await blobToDataUrl(blob)}catch(error){}}}downloadJson(payload,'ipba-rosters-'+new Date().toISOString().slice(0,10)+'.json');setStatus('ESPORTAZIONE COMPLETATA')}
        function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
        function dataUrlToBlob(value){const match=String(value||'').match(/^data:([^;]+);base64,(.+)$/);if(!match)throw new Error('Immagine incorporata non valida');const bytes=atob(match[2]),arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:match[1]})}
        function downloadJson(value,name){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
        async function importExport(file){if(file.size>50*1024*1024)throw new Error('File importazione troppo grande');const payload=JSON.parse(await file.text());if(!payload||payload.format!=='IPBA_ROSTER_EXPORT'||payload.version!==1||!payload.teams)throw new Error('Formato esportazione non valido');for(const [id,raw] of Object.entries(payload.teams)){const roster=Core.normalizeRoster(raw,id),result=await Storage.saveTeam(roster);const side=ids.A===id?'A':ids.B===id?'B':null;if(side){state[side]=result.roster;state.storage[side]=result.storage}for(const player of roster.players){const encoded=payload.embeddedImages&&payload.embeddedImages[id+'|'+player.playerKey];if(!encoded)continue;const blob=dataUrlToBlob(encoded),prepared=await prepareImage(new File([blob],player.playerKey+'.png',{type:blob.type})),uploaded=await Storage.uploadPlayerImage(id,player.playerKey,prepared.blob,prepared);player.image.customImageUrl=uploaded.url;player.image.customImageStorageKey=uploaded.storageKey;player.image.selectedSource='CUSTOM';player.image.hasTransparency=prepared.hasTransparency}await Storage.saveTeam(roster)}state.dirty=false;renderAll();refreshPreview();toast('Configurazioni importate')}

        function restoreOriginal(){if(!confirm('Ripristinare dati e regolazioni IPBA? Le foto personalizzate restano archiviate ma non saranno selezionate.'))return;['A','B'].forEach(side=>{const roster=state[side];if(!roster)return;roster.players.forEach((p,i)=>{p.customData={firstName:'',lastName:'',displayName:'',number:'',role:'',nickname:'',visible:true,order:i+1,row:'AUTO',rowPosition:i+1};Object.assign(p.image,{selectedSource:'ORIGINAL',scale:1,offsetX:0,offsetY:0,bustHeight:72,cropTop:0,cropBottom:12,flipX:false,shadow:true,glow:true})})});markDirty();renderAll()}

        document.addEventListener('click',async event=>{const action=event.target.closest('[data-action]')&&event.target.closest('[data-action]').dataset.action;if(action==='import-a')await importSide('A');else if(action==='import-b')await importSide('B');else if(action==='import-both'){await importSide('A');await importSide('B')}else if(action==='save')await saveAll();else if(action==='preview'){$('preview').scrollIntoView({behavior:'smooth'});sendPreview('REPLAY_ANIMATION')}else if(action==='open-transparent')open(rosterUrl(false),'_blank');else if(action==='export')await exportAll();else if(action==='import-file')$('import-file').click();else if(action==='restore')restoreOriginal();else if(action==='add-player')addManual();const cmd=event.target.closest('[data-cmd]');if(cmd)sendPreview(cmd.dataset.cmd);const bg=event.target.closest('[data-bg]');if(bg)sendPreview('ROSTER_PREVIEW_BACKGROUND',bg.dataset.bg)});
        $('import-file').addEventListener('change',async event=>{try{if(event.target.files[0])await importExport(event.target.files[0])}catch(error){toast(error.message,true)}event.target.value=''});
        addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue=''}});
        init();
    </script>
