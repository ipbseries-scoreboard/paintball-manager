<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPBA LED Wall Scoreboard</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Orbitron:wght@700&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffff00;
            /* High visibility yellow */
            --timer-color: #ffff00;
            --team-a-color: #ffffff;
            --team-b-color: #ffffff;
            --font-main: 'Oswald', sans-serif;
            --font-timer: 'Oswald', sans-serif;
            --font-narrow: 'Bebas Neue', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SCALER CONTAINER (SQUARE 1:1) */
        #scaler {
            width: 1080px;
            height: 1080px;
            position: absolute;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #connect-ui {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
            position: fixed;
            width: 80%;
            max-width: 600px;
        }

        input {
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            border: none;
            background: #000;
            color: white;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: var(--accent-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* LED WALL LAYOUT */
        #scoreboard {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* TOP SECTION: TIMER */
        .timer-section {
            width: 100%;
            text-align: center;
            flex: 0 0 auto;
            margin-top: 20px;
        }

        #timer {
            font-family: var(--font-timer);
            font-size: 450px;
            line-height: 0.9;
            color: var(--timer-color);
            text-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            font-variant-numeric: tabular-nums;
            margin-top: -20px;
        }

        /* MIDDLE SECTION: TEAMS & SCORES */
        .match-section {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
            padding: 0 10px;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 48%;
        }

        .team-name {
            font-family: var(--font-narrow);
            font-size: 100px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            text-align: center;
            margin-bottom: -10px;
            letter-spacing: 2px;
        }

        .score {
            font-size: 550px;
            font-weight: 900;
            line-height: 0.75;
        }

        #panel-left .team-name {
            color: var(--team-a-color);
        }

        #panel-left .score {
            color: var(--team-a-color);
        }

        #panel-right .team-name {
            color: var(--team-b-color);
        }

        #panel-right .score {
            color: var(--team-b-color);
        }

        .penalty-text {
            font-family: var(--font-main);
            font-size: 60px;
            font-weight: bold;
            margin-top: 10px;
            text-transform: uppercase;
            animation: flash 0.5s infinite alternate;
            display: none;
        }

        .major-pen {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        .minor-pen {
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.6);
        }

        @keyframes flash {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div id="connect-ui">
        <h2 style="color: var(--accent-color); margin: 0; text-align: center; font-size: 2.5rem;">LED WALL VIEWER (1:1)
        </h2>
        <p style="text-align: center; color: #94a3b8; font-size: 1.2rem;">Inserisci il Match ID dalla finestra di Regia
            (index.html)</p>
        <input type="text" id="match-id" placeholder="es. 1234" />
        <button id="connect-btn">CONNETTI</button>
    </div>

    <div id="scaler">
        <div id="scoreboard">
            <!-- TIMER TOP -->
            <div class="timer-section">
                <div id="timer">10:00</div>
            </div>

            <!-- TEAMS MIDDLE -->
            <div class="match-section">
                <div class="team-box" id="panel-left">
                    <div class="team-name" id="name-left">TEAM A</div>
                    <div class="score" id="score-left">0</div>
                    <div class="penalty-text" id="penalty-left">MINOR PENALTY</div>
                </div>

                <div class="team-box" id="panel-right">
                    <div class="team-name" id="name-right">TEAM B</div>
                    <div class="score" id="score-right">0</div>
                    <div class="penalty-text" id="penalty-right">MINOR PENALTY</div>
                </div>
            </div>

        </div>
    </div>
    </div>

    <script>
        const btn = document.getElementById('connect-btn');
        const input = document.getElementById('match-id');
        const ui = document.getElementById('connect-ui');
        const sb = document.getElementById('scoreboard');
        const scaler = document.getElementById('scaler');

        function cleanTeamName(name) {
            if (!name) return "";
            let cleaned = name.trim();

            // Pattern: "PHASE PREFIX - Team Name" 
            if (cleaned.includes(" - ")) {
                const parts = cleaned.split(" - ");
                const phaseRegex = /QUARTI|SEMIFINALI|FINALE|FINALI|OTTAVI|ROUND|PLAYOFF|POSTO|QUALIFICAZIONI/i;
                if (phaseRegex.test(parts[0])) {
                    cleaned = parts[1].trim();
                }
            }

            return cleaned.replace(/^SQUADRA\s+[A-Z]$/i, "")
                .replace(/^TEAM\s+[A-Z]$/i, "")
                .trim() || name;
        }

        function smartTruncate(str, limit) {
            if (!str) return "";
            str = str.trim().toUpperCase();
            if (str.length <= limit) return str;

            const words = str.split(/\s+/).filter(w => w.length > 0);

            if (words.length >= 3) {
                // First 4 letters + 2nd word initial + Last word
                const w1 = words[0].substring(0, 4);
                const w2Initial = words[1].substring(0, 1) + ".";
                const lastWord = words[words.length - 1];

                const prefix = w1 + " " + w2Initial + " ";
                const remaining = limit - prefix.length;

                return (prefix + (remaining > 0 ? lastWord.substring(0, remaining) : "")).trim();
            } else if (words.length === 2) {
                // First 4 letters + Last word
                const w1 = words[0].substring(0, 4);
                const lastWord = words[1];

                const prefix = w1 + " ";
                const remaining = limit - prefix.length;

                return (prefix + (remaining > 0 ? lastWord.substring(0, remaining) : "")).trim();
            } else {
                // Single word
                return str.substring(0, limit);
            }
        }

        // SCALING (SQUARE 1:1)
        function scaleBoard() {
            const targetWidth = 1080;
            const targetHeight = 1080;
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const scale = Math.min(winW / targetWidth, winH / targetHeight);
            scaler.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scaleBoard);
        scaleBoard();

        // PEERJS
        btn.addEventListener('click', () => {
            const id = input.value.trim();
            if (!id) return;
            startClient(id);
        });

        function startClient(hostId) {
            if (hostId && !hostId.startsWith("IPBA-")) hostId = "IPBA-" + hostId;

            const customIceConfig = {
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                    ]
                }
            };
            const peer = new Peer(customIceConfig);
            peer.on('open', (myId) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => {
                    localStorage.setItem('last_match_id', hostId.replace('IPBA-', ''));
                    ui.style.display = 'none';
                    sb.style.display = 'flex';
                    scaleBoard();
                });

                conn.on('data', (data) => {
                    updateUI(data);
                });

                conn.on('close', () => {
                    alert("Connessione persa!");
                    location.reload();
                });
            });
        }

        function updateUI(d) {
            // Timer
            let timerStr = d.timer || "00:00";
            if (timerStr.includes('.')) {
                timerStr = timerStr.split('.')[0];
            }
            document.getElementById('timer').innerText = timerStr;

            // Teams & Scores
            const styleLimit = (d.styleConfig && d.styleConfig.limit) || 11;

            const lNameRaw = d.teamLeft.name || "TEAM A";
            document.getElementById('name-left').innerText = smartTruncate(cleanTeamName(lNameRaw), styleLimit);
            document.getElementById('score-left').innerText = d.teamLeft.score;

            const rNameRaw = d.teamRight.name || "TEAM B";
            document.getElementById('name-right').innerText = smartTruncate(cleanTeamName(rNameRaw), styleLimit);
            document.getElementById('score-right').innerText = d.teamRight.score;




            // Auto Color Sync
            // Removed dynamic team color sync for scores/names as per user request (kept white)
            // if (d.teamLeft.color) document.documentElement.style.setProperty('--team-a-color', d.teamLeft.color);
            // if (d.teamRight.color) document.documentElement.style.setProperty('--team-b-color', d.teamRight.color);
        }


        // Auto-connect if last ID exists
        const lastId = localStorage.getItem('last_match_id');
        if (lastId) input.value = lastId;

    </script>
</body>

</html>
