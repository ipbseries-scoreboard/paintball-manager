<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Wall Display - IPBA</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --accent-color: #22d3ee;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --team-a-color: #3b82f6;
            --team-b-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }

        #scaler {
            transform-origin: top left;
        }

        #connect-ui {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #connect-ui input {
            padding: 15px;
            font-size: 24px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #111;
            color: white;
            text-align: center;
        }

        #connect-ui button {
            padding: 15px 40px;
            font-size: 24px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: black;
            font-weight: 900;
            cursor: pointer;
        }

        #scoreboard {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- LED WALL LAYOUT --- */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px 1fr;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            gap: 20px;
        }

        .team-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border-bottom: 20px solid #ccc;
        }

        #panel-left {
            border-color: var(--team-a-color);
        }

        #panel-right {
            border-color: var(--team-b-color);
        }

        .team-name {
            font-size: 100px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1;
        }

        .team-score {
            font-size: 450px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            line-height: 0.8;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .timer-box {
            background: #111;
            padding: 40px 20px;
            border-radius: 20px;
            border: 5px solid #333;
            width: 100%;
            text-align: center;
        }

        #timer {
            font-size: 150px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            color: #fbbf24;
            line-height: 1;
        }

        .match-info {
            font-size: 40px;
            font-weight: 900;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* SYNC OVERLAY */
        #sync-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
        }

        .loader {
            border: 8px solid #333;
            border-top: 8px solid var(--accent-color);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="connect-ui">
        <h2 style="color: var(--accent-color); margin: 0;">LED WALL VIEW</h2>
        <input type="text" id="match-id" placeholder="Match ID">
        <button id="connect-btn"
            onclick="const id = document.getElementById('match-id').value; if(id) startClient(id);">CONNETTI</button>
    </div>

    <div id="scaler">
        <div id="scoreboard">
            <div id="sync-overlay">
                <div class="loader"></div>
                <h2 style="color: var(--accent-color);">SINCRONIZZAZIONE...</h2>
            </div>

            <div class="main-container">
                <div class="team-panel" id="panel-left">
                    <div class="team-name" id="name-left">SQUADRA A</div>
                    <div class="team-score" id="score-left">0</div>
                </div>

                <div class="center-panel">
                    <div class="match-info" id="match-phase">GIRONI</div>
                    <div class="timer-box">
                        <div id="timer">10:00</div>
                    </div>
                    <div class="match-info" id="game-state">PRONTO</div>
                </div>

                <div class="team-panel" id="panel-right">
                    <div class="team-name" id="name-right">SQUADRA B</div>
                    <div class="team-score" id="score-right">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ui = document.getElementById('connect-ui');
        const sb = document.getElementById('scoreboard');
        const scaler = document.getElementById('scaler');
        const input = document.getElementById('match-id');
        const btn = document.getElementById('connect-btn');
        let clientConn = null;

        function scaleBoard() {
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            scaler.style.transform = `scale(${scale})`;
        }
        window.onresize = scaleBoard;
        scaleBoard();

        const lastId = localStorage.getItem('last_match_id');
        if (lastId) input.value = lastId;

        function startClient(hostId) {
            if (!hostId.startsWith("IPBA-")) hostId = "IPBA-" + hostId;
            if (btn) btn.innerText = "CONNESSIONE...";

            const customIceConfig = {
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.relay.metered.ca:80' },
                        { urls: 'turn:global.relay.metered.ca:80', username: 'fe841146f64ad98d3f631f65', credential: '1RWiOOZ7GOYCgcBw' },
                        { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'fe841146f64ad98d3f631f65', credential: '1RWiOOZ7GOYCgcBw' },
                        { urls: 'turn:global.relay.metered.ca:443', username: 'fe841146f64ad98d3f631f65', credential: '1RWiOOZ7GOYCgcBw' },
                        { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'fe841146f64ad98d3f631f65', credential: '1RWiOOZ7GOYCgcBw' }
                    ]
                }
            };

            const peer = new Peer(customIceConfig);

            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                clientConn = conn;

                conn.on('open', () => {
                    ui.style.display = 'none';
                    sb.style.display = 'flex';
                    localStorage.setItem('last_match_id', hostId.replace("IPBA-", ""));
                });

                conn.on('data', (data) => {
                    let packet = data;
                    if (typeof data === 'string') {
                        try { packet = JSON.parse(data); } catch (e) { return; }
                    }
                    updateBoardFromPacket(packet);
                });

                conn.on('close', () => {
                    console.warn("Connection lost. Retrying...");
                    setTimeout(() => startClient(hostId), 2000);
                });

                conn.on('error', (err) => {
                    console.error("Conn Error:", err);
                    setTimeout(() => startClient(hostId), 5000);
                });
            });

            peer.on('disconnected', () => {
                peer.reconnect();
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    setTimeout(() => startClient(hostId), 10000);
                }
            });
        }

        const syncChannel = new BroadcastChannel('pm_sync');
        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'STATE_UPDATE') {
                updateBoardFromPacket(event.data.payload);
            }
        };

        // PUBLIC SYNC (Spectators)
        setInterval(() => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('cloud') === '1') {
                fetch('./state.json?t=' + Date.now())
                    .then(r => r.json())
                    .then(packet => updateBoardFromPacket(packet))
                    .catch(() => { });
            } else if (!clientConn || !clientConn.open) {
                const lastState = localStorage.getItem('pm_last_state');
                if (lastState) {
                    try {
                        const packet = JSON.parse(lastState);
                        updateBoardFromPacket(packet);
                    } catch (e) { }
                }
            }
        }, 1000);

        function updateBoardFromPacket(d) {
            const overlay = document.getElementById('sync-overlay');
            if (overlay) overlay.style.display = 'none';

            document.getElementById('timer').innerText = d.timer || "00:00";
            document.getElementById('match-phase').innerText = d.phase || "";
            document.getElementById('game-state').innerText = d.statusText || "PRONTO";

            const styleLimit = (d.styleConfig && d.styleConfig.limit) || 11;
            document.getElementById('name-left').innerText = smartTruncate(cleanTeamName(d.teamLeft.name), styleLimit);
            document.getElementById('score-left').innerText = d.teamLeft.score;
            document.getElementById('name-right').innerText = smartTruncate(cleanTeamName(d.teamRight.name), styleLimit);
            document.getElementById('score-right').innerText = d.teamRight.score;
        }

        function cleanTeamName(name) {
            if (!name) return "";
            return name.replace(/QUARTI|SEMIFINALE|FINALE|GIRONI|MATCH/i, "").trim();
        }

        // Auto-connect if last ID exists or in URL
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const lastId = localStorage.getItem('last_match_id');

            if (id) {
                input.value = id;
                startClient(id);
            } else if (lastId) {
                input.value = lastId;
            }
        });
    </script>
</body>

</html>
