<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPBA LED Wall Scoreboard</title>
    <!-- PeerJS CDN -->
    <script src="lib/peerjs.min.js"></script>
    <script>window.Peer || document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
    <script src="turn-config.js?v=1"></script>
    <script src="pm-client.js?v=2.2.0-fan-turn"></script>
    <script src="time-format.js?v=1.0.0-mmss"></script>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="lib/fonts/pm-fonts.css">
    <script src="wake-lock.js?v=1.0.0"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffff00;
            /* High visibility yellow */
            --timer-color: #ffff00;
            --team-a-color: #ffffff;
            --team-b-color: #ffffff;
            --font-main: 'Oswald', sans-serif;
            --font-timer: 'Oswald', sans-serif;
            --font-narrow: 'Bebas Neue', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SCALER CONTAINER (SQUARE 1:1) */
        #scaler {
            width: 1080px;
            height: 1080px;
            position: absolute;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #connect-ui {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
            position: fixed;
            width: 80%;
            max-width: 600px;
        }

        input {
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            border: none;
            background: #000;
            color: white;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: var(--accent-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* LED WALL LAYOUT */
        #scoreboard {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }

        /* TOP SECTION: TIMER */
        .timer-section {
            width: 100%;
            text-align: center;
            flex: 0 0 auto;
            margin-top: 20px;
        }

        #timer {
            font-family: var(--font-timer);
            font-size: 450px;
            line-height: 0.9;
            color: var(--timer-color);
            text-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            font-variant-numeric: tabular-nums;
            margin-top: -20px;
        }

        /* MIDDLE SECTION: TEAMS & SCORES */
        .match-section {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
            padding: 0 10px;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 48%;
        }

        .team-name {
            font-family: var(--font-narrow);
            font-size: 100px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            text-align: center;
            margin-bottom: -10px;
            letter-spacing: 2px;
        }

        .score {
            font-size: 550px;
            font-weight: 900;
            line-height: 0.75;
        }

        #panel-left .team-name,
        #panel-left .score {
            color: var(--team-a-color);
        }

        #panel-right .team-name,
        #panel-right .score {
            color: var(--team-b-color);
        }

        .penalty-text {
            font-family: var(--font-main);
            font-size: 60px;
            font-weight: bold;
            margin-top: 10px;
            text-transform: uppercase;
            animation: flash 0.5s infinite alternate;
            display: none;
        }

        .major-pen {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        .minor-pen {
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.6);
        }

        @keyframes flash {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.3;
            }
        }

        /* SYNC OVERLAY */
        #sync-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
        }

        .loader {
            border: 12px solid #333;
            border-top: 12px solid var(--accent-color);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="connect-ui">
        <h2 style="color: var(--accent-color); margin: 0; text-align: center; font-size: 2.5rem;">LED WALL VIEWER (1:1)
        </h2>
        <p style="text-align: center; color: #94a3b8; font-size: 1.2rem;">Inserisci il Match ID dalla finestra di Regia
        </p>
        <input type="text" id="match-id" placeholder="es. 1234" />
        <button id="connect-btn" onclick="startClient(document.getElementById('match-id').value)">CONNETTI</button>
    </div>

    <div id="scaler">
        <div id="scoreboard">
            <div id="sync-overlay">
                <div class="loader"></div>
                <h2 style="color: var(--accent-color); font-size: 60px;">SINCRONIZZAZIONE...</h2>
            </div>
            <!-- TIMER TOP -->
            <div class="timer-section">
                <div id="timer">10:00</div>
            </div>

            <!-- TEAMS MIDDLE -->
            <div class="match-section">
                <div class="team-box" id="panel-left">
                    <div class="team-name" id="name-left">TEAM A</div>
                    <div class="score" id="score-left">0</div>
                    <div class="penalty-text" id="penalty-left">MINOR PENALTY</div>
                </div>

                <div class="team-box" id="panel-right">
                    <div class="team-name" id="name-right">TEAM B</div>
                    <div class="score" id="score-right">0</div>
                    <div class="penalty-text" id="penalty-right">MINOR PENALTY</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let clientConn = null;
        const ui = document.getElementById('connect-ui');
        const sb = document.getElementById('scoreboard');
        const scaler = document.getElementById('scaler');
        const input = document.getElementById('match-id');
        const btn = document.getElementById('connect-btn');

        function scaleBoard() {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const scale = Math.min(winW / 1080, winH / 1080);
            scaler.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleBoard);
        scaleBoard();

        function cleanTeamName(name) {
            if (!name) return "";
            return name.replace(/QUARTI|SEMIFINALI|FINALE|GIRONI|MATCH/i, "").trim();
        }

        function smartTruncate(str, limit) {
            if (!str) return "";
            str = str.trim().toUpperCase();
            if (str.length <= limit) return str;
            const words = str.split(/\s+/).filter(w => w.length > 0);
            if (words.length >= 2) {
                const w1 = words[0].substring(0, 4);
                return (w1 + " " + words[words.length - 1].substring(0, limit - 5)).trim();
            }
            return str.substring(0, limit);
        }

        function startClient(hostId) {
            if (!hostId) return;
            btn.innerText = "CONNESSIONE...";

            // Il trasporto (retry, PING/PONG, fallback locale->cloud) è gestito da pm-client.js
            if (clientConn) clientConn.destroy();
            clientConn = PMClient.connect({
                id: hostId,
                staleBadge: true,
                onStatus: (msg) => { btn.innerText = msg; },
                onOpen: () => {
                    localStorage.setItem('last_match_id', PMClient.normalizeId(hostId).replace('IPBA-', ''));
                    ui.style.display = 'none';
                    sb.style.display = 'flex';
                    scaleBoard();
                },
                onData: updateBoardFromPacket
            });
        }

        const syncChannel = new BroadcastChannel('pm_sync');
        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'STATE_UPDATE') updateBoardFromPacket(event.data.payload);
        };

        setInterval(() => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('cloud') === '1') {
                fetch('./state.json?t=' + Date.now()).then(r => r.json()).then(p => updateBoardFromPacket(p)).catch(() => { });
            } else if (!clientConn || !clientConn.open) {
                const last = localStorage.getItem('pm_last_state');
                if (last) { try { updateBoardFromPacket(JSON.parse(last)); } catch (e) { } }
            }
        }, 1000);

        function updateBoardFromPacket(d) {
            if (!d) return;
            const overlay = document.getElementById('sync-overlay');
            if (overlay) overlay.style.display = 'none';

            const timerStr = PMTimeFormat.mmss(d.timer);
            document.getElementById('timer').innerText = timerStr;

            const limit = (d.styleConfig && d.styleConfig.limit) || 11;
            if (d.teamLeft) {
                document.getElementById('name-left').innerText = smartTruncate(cleanTeamName(d.teamLeft.name), limit);
                document.getElementById('score-left').innerText = d.teamLeft.score;
            }
            if (d.teamRight) {
                document.getElementById('name-right').innerText = smartTruncate(cleanTeamName(d.teamRight.name), limit);
                document.getElementById('score-right').innerText = d.teamRight.score;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || params.get('matchId');
            const lastId = localStorage.getItem('last_match_id');
            if (id) { input.value = id; startClient(id); }
            else if (lastId) { input.value = lastId; }
        });
    </script>
</body>

</html>
